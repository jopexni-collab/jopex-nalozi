# nginx konfiguracija za JoPeX aplikaciju iza reverse proxy-ja
# Ključno: mora proslijediti Cookie header (ulazni) i Set-Cookie (izlazni), plus
# standardna X-Forwarded-* zaglavlja da Express zna da je konekcija stvarno HTTPS.

server {
    listen 443 ssl;
    server_name tvoj-domen.com;  # <- zamijeni sa stvarnim domenom

    ssl_certificate     /putanja/do/fullchain.pem;   # <- zamijeni
    ssl_certificate_key /putanja/do/privkey.pem;      # <- zamijeni

    location / {
        proxy_pass http://127.0.0.1:3000;  # <- zamijeni sa stvarnim portom Node app-a

        # OBAVEZNO — bez ovoga Express ne zna da je originalna konekcija HTTPS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # <- ovo Express čita da zna "https"
        proxy_set_header X-Forwarded-Host  $host;

        # OBAVEZNO — cookie mora proći u oba smjera, bez ovoga se GUBI sesija
        proxy_pass_request_headers on;
        # (Set-Cookie iz app-a prolazi automatski, osim ako je negdje eksplicitno
        # blokiran sa "proxy_hide_header Set-Cookie;" — provjeri da TOGA nema u
        # konfiguraciji, ni u ovom fajlu ni u nekom uključenom/included fajlu.)

        # Preporučeno — stabilnije proslijeđivanje, izbjegava probleme sa keep-alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Ako imaš keš/buffering aktivan negdje uzvodno, isključi ga za ovu rutu —
        # keširan odgovor sa Set-Cookie bi mogao da posluži TUĐI kolačić drugom korisniku.
        proxy_buffering off;
    }
}

# Opcionalno — preusmjeri http:// na https:// (ako još nema)
server {
    listen 80;
    server_name tvoj-domen.com;  # <- zamijeni
    return 301 https://$host$request_uri;
}
