<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teren – JoPeX</title>
<style>
:root{--blue:#1a5fa8;--dark:#134a85;--bg:#f3f5f8;--border:#dde3ea;--red:#c0392b;--green:#1f8a4c;--orange:#b8860b;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);}
header{background:var(--blue);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
header h1{margin:0;font-size:16px;}
header nav{display:flex;gap:10px;align-items:center;}
header nav a{color:#fff;text-decoration:none;font-size:12px;opacity:.9;border:1px solid rgba(255,255,255,.4);padding:5px 10px;border-radius:6px;}
#who{font-size:12px;opacity:.85;}
main{max-width:680px;margin:16px auto;padding:0 14px 60px;}
.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tab-btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--dark);}
.tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.view{display:none;}
.view.active{display:block;}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px;}
.card h2{margin:0 0 14px;font-size:15px;color:var(--dark);}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.fg label{font-size:12px;font-weight:600;color:#6b7a8d;}
.fg label.req::after{content:' *';color:var(--red);}
.fg input,.fg select,.fg textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;width:100%;}
.fg textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn:disabled{background:#9fb3c8;cursor:not-allowed;}
.btn-outline{background:none;border:1px solid var(--blue);color:var(--blue);}
.btn-red{background:var(--red);}
.btn-green{background:var(--green);}
#msg{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13.5px;display:none;}
.ok{background:#e3f5ea;color:var(--green);border:1px solid #b9e4c9;}
.err{background:#fbe9e7;color:var(--red);border:1px solid #f3c6c0;}
.stavka-tip-izbor{display:flex;gap:8px;margin-bottom:12px;}
.stavka-tip-izbor button{flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);background:#fff;font-weight:700;font-size:12.5px;cursor:pointer;}
.stavka-tip-izbor button.active.lager{border-color:var(--blue);background:#eef4fc;color:var(--blue);}
.stavka-tip-izbor button.active.proizvodnja{border-color:var(--orange);background:#fff8e6;color:var(--orange);}
.stavke-lista{margin-top:10px;}
.stavka-red{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;}
.stavka-red.lager{background:#eef4fc;}
.stavka-red.proizvodnja{background:#fff8e6;}
.stavka-red .ukloni{color:var(--red);font-weight:900;cursor:pointer;padding:2px 8px;}
.rez-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:4px;}
.rez-item{padding:9px 10px;border-bottom:1px solid #f0f2f5;cursor:pointer;font-size:13px;}
.rez-item:hover{background:#f7f8fa;}
.ponuda-kartica{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:14px;margin-bottom:10px;}
.ponuda-status{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:12px;}
.st-poslato{background:#fff3e0;color:var(--orange);}
.st-potvrdjeno{background:#e6f4ea;color:var(--green);}
.st-otkazano{background:#fce8e6;color:var(--red);}
.empty-msg{text-align:center;color:#999;padding:24px;font-size:13px;}
.posalji-lbl{font-size:11.5px;font-weight:700;color:#6b7a8d;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
.posalji-btns{display:flex;gap:8px;}
.btn-posalji{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11px;font-weight:700;padding:10px 4px;border-radius:10px;border:1px solid var(--border);background:#fff;color:#1a2733;cursor:pointer;min-height:56px;text-decoration:none;}
.btn-posalji .ic{font-size:20px;}
.btn-posalji.viber{color:#7360f2;}
.btn-posalji.whatsapp{color:#25d366;}
.btn-posalji.email{color:var(--blue);}
.posalji-link{font-size:10.5px;color:#8b96a5;text-align:center;margin-top:8px;word-break:break-all;}

/* ═══ Katalog sa slikama (ciglice) ═══════════════════════════════════════
   Oblik je preuzet iz JoPeX logotipa: 340×170 sa radijusom 28,35 — odnos 2:1
   i radijus 8,34 % sirine. Komercijalista na terenu tako moze da POKAZE kamen
   kupcu, umjesto da mu cita sifru. */
.kat-dugme{width:100%;padding:11px;margin-top:6px;border-radius:8px;border:1px solid var(--blue);
  background:#fff;color:var(--blue);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;}
.kat-dugme:hover{background:#eef4fc;}

.kat-preko{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;}
.kat-preko.otvoren{display:flex;}
.kat-vrh{background:var(--blue);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.kat-vrh input,.kat-vrh select{font:inherit;font-size:14px;padding:8px 10px;border:0;border-radius:7px;min-width:0;}
.kat-vrh input{flex:1 1 150px;}
.kat-vrh select{flex:0 1 140px;}
.kat-zatvori{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:7px;
  width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;flex:0 0 auto;}
.kat-brojac{font-size:11.5px;opacity:.85;flex-basis:100%;}
.kat-tijelo{flex:1;overflow-y:auto;padding:12px;}
.kat-mreza{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}

.kat-cigla{position:relative;aspect-ratio:340/170;border-radius:8.34%/16.68%;overflow:hidden;
  background:var(--blue) center/cover no-repeat;color:#fff;cursor:pointer;border:0;padding:0;
  font:inherit;text-align:left;display:block;box-shadow:0 2px 8px rgba(16,24,40,.12);}
.kat-cigla:active{transform:scale(.985);}
.kat-cigla .veo{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 42%,rgba(0,0,0,.6) 100%);}
.kat-cigla.bez-slike .veo{background:linear-gradient(135deg,var(--blue) 0%,var(--dark) 100%);}
.kat-cigla .txt{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;}
.kat-cigla .ime{font-weight:600;font-size:13px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.kat-cigla .c{font-size:16px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5);margin-top:2px;}
.kat-cigla .c small{font-size:10.5px;font-weight:500;opacity:.85;}
.kat-cigla .zn{position:absolute;top:8px;left:10px;background:rgba(255,255,255,.92);color:var(--blue);
  font-size:10px;font-weight:800;padding:2px 7px;border-radius:12px;text-transform:uppercase;}
.kat-cigla .st{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.45);color:#fff;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:12px;}
.kat-cigla .st.nema{background:var(--red);}

/* Uvecavanje na puni ekran — da se kupcu pokaze kamen izbliza. */
.kat-zum-pozadina{position:fixed;inset:0;z-index:210;background:rgba(10,20,35,0);
  transition:background .3s ease;}
.kat-zum-pozadina.vidljiva{background:rgba(10,20,35,.9);}
.kat-let{position:fixed;z-index:211;border-radius:8.34%/16.68%;overflow:hidden;
  background:var(--blue) center/cover no-repeat;transform-origin:top left;
  will-change:transform;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.kat-panel{position:fixed;left:0;right:0;bottom:0;z-index:212;padding:16px;
  background:#fff;border-radius:14px 14px 0 0;opacity:0;transition:opacity .2s ease;}
.kat-panel.vidljiv{opacity:1;}
.kat-panel h3{margin:0 0 4px;font-size:15px;color:var(--dark);}
.kat-panel .meta{font-size:12.5px;color:#6b7a8d;margin-bottom:12px;}
.kat-panel .cijena{font-size:22px;font-weight:800;color:var(--dark);margin-bottom:12px;}
.kat-zum-zatvori{position:fixed;top:14px;right:14px;z-index:213;width:40px;height:40px;
  border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer;}
@media (prefers-reduced-motion:reduce){
  .kat-zum-pozadina,.kat-panel{transition:none;}
}
</style>
</head>
<body>
<header>
  <h1>🚐 Teren — JoPeX</h1>
  <nav>
    <span id="who"></span>
    <a href="home.html">← Početna</a>
    <a href="#" id="logout">Odjava</a>
  </nav>
</header>
<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="nova" onclick="prebaciTab('nova')">+ Nova ponuda</button>
    <button class="tab-btn" data-tab="moje" onclick="prebaciTab('moje')">Moje ponude</button>
    <button class="tab-btn" data-tab="admin" id="tab-admin-btn" style="display:none;" onclick="prebaciTab('admin')">Za potvrdu</button>
  </div>

  <!-- ═══ NOVA PONUDA ═══ -->
  <div class="view active" id="view-nova">
    <div class="card">
      <h2>Podaci o kupcu</h2>
      <div class="fg">
        <label class="req">Naziv / Ime</label>
        <input type="text" id="kupac-naziv" placeholder="Ime kupca ili firme — počni da kucaš za postojeće" autocomplete="off" oninput="pretraziKupca()">
        <div class="rez-list" id="kupac-rezultati" style="display:none;"></div>
      </div>
      <div class="row2">
        <div class="fg"><label>Telefon</label><input type="text" id="kupac-telefon"></div>
        <div class="fg"><label>Adresa</label><input type="text" id="kupac-adresa"></div>
      </div>
      <div id="kupac-status" style="display:none;font-size:12.5px;padding:9px 11px;border-radius:8px;margin-bottom:2px;"></div>
      <div class="fg">
        <label>Prodajni objekat (za robu sa lagera)</label>
        <select id="objekat-select"><option value="">— izaberi ako nudiš robu sa lagera —</option></select>
        <div style="font-size:10.5px;color:#8b96a5;margin-top:3px;">Napomena: PJ Niš i BiH PJ-ovi (Aleksandrovac/Vrbanja/Vojkovići) imaju odvojene liste kupaca — izaberi PJ PRIJE pretrage kupca, radi tačnih rezultata.</div>
      </div>
    </div>

    <div class="card">
      <h2>Uslovi ponude</h2>
      <div class="row2">
        <div class="fg"><label>Način plaćanja</label><input type="text" id="nacin-placanja" placeholder="npr. Avans 50% + ostatak po isporuci"></div>
        <div class="fg"><label>Valuta</label>
          <select id="valuta-select"><option value="KM">KM</option><option value="EUR">EUR (€)</option></select>
        </div>
      </div>
      <div class="row2">
        <div class="fg">
          <label>Paritet isporuke</label>
          <select id="paritet-select" onchange="document.getElementById('paritet-adresa-fg').style.display=this.value==='fco_drugo'?'block':'none';">
            <option value="">— nije određeno —</option>
            <option value="fco_kupac">FCO Kupac</option>
            <option value="fco_skladiste">FCO Skladište</option>
            <option value="fco_drugo">FCO — druga adresa (npr. gradilište)</option>
          </select>
        </div>
        <div class="fg"><label>Vrijeme isporuke</label><input type="text" id="vreme-isporuke" placeholder="npr. 3-5 radnih dana"></div>
      </div>
      <div class="row2">
        <div class="fg" id="paritet-adresa-fg" style="display:none;"><label>Adresa isporuke (za FCO drugo)</label><input type="text" id="paritet-adresa"></div>
        <div class="fg"><label>Ponuda važi do</label><input type="date" id="vazi-do"></div>
      </div>
    </div>

    <div class="card">
      <h2>Dodaj stavku</h2>
      <div class="stavka-tip-izbor">
        <button type="button" id="btn-tip-lager" class="lager" onclick="izaberiTipStavke('lager')">📦 Sa lagera</button>
        <button type="button" id="btn-tip-proizvodnja" class="proizvodnja" onclick="izaberiTipStavke('proizvodnja')">🔨 Za proizvodnju</button>
      </div>

      <div id="forma-lager" style="display:none;">
        <div class="fg">
          <label>Pretraga artikla (šifra ili naziv)</label>
          <input type="text" id="lager-search" placeholder="Počni da kucaš..." oninput="pretraziLager()">
          <div class="rez-list" id="lager-rezultati" style="display:none;"></div>
        </div>
        <button type="button" class="kat-dugme" onclick="otvoriKatalog()">🖼 Katalog sa slikama</button>
        <div id="lager-izabrano" style="display:none;background:#f7f8fa;border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px;font-weight:700;"></div>
        <div class="row2">
          <div class="fg"><label>Količina</label><input type="number" id="lager-kolicina" step="0.01" min="0"></div>
          <div class="fg"><label>Cijena (po jed.)</label><input type="number" id="lager-cijena" step="0.01" min="0"></div>
        </div>
        <div class="fg"><label>Link slike (opciono)</label><input type="text" id="lager-slika" placeholder="https://..."></div>
        <button type="button" class="btn btn-outline" onclick="dodajLagerStavku()">+ Dodaj stavku sa lagera</button>
      </div>

      <div id="forma-proizvodnja" style="display:none;">
        <div class="row2">
          <div class="fg">
            <label>Zadatak</label>
            <select id="pr-zadatak">
              <option value="">— izaberi —</option>
              <option>Kuhinjska ploča</option><option>Sto</option>
              <option>Klupice, Step</option><option>Na Mjeru</option>
              <option>Usluge Mašina</option><option>Usluge WJ</option>
              <option value="__slobodno__">Slobodno (upiši sam)</option>
            </select>
            <input type="text" id="pr-zadatak-slobodno" placeholder="Upiši zadatak..." style="display:none;margin-top:6px;">
          </div>
          <div class="fg"><label>Materijal</label><select id="pr-materijal"><option value="">— izaberi —</option></select></div>
        </div>
        <div class="fg">
          <label>Kategorija (za obračun bonusa)</label>
          <select id="pr-kategorija"><option value="">— izaberi —</option></select>
        </div>
        <div class="fg"><label>Napomena / dimenzije</label><textarea id="pr-napomena" placeholder="Detalji dogovora..."></textarea></div>
        <div class="fg"><label>Ponuđena cijena (KM)</label><input type="number" id="pr-cijena" step="0.01" min="0"></div>
        <button type="button" class="btn btn-outline" onclick="dodajProizvodnjaStavku()">+ Dodaj stavku za proizvodnju</button>
      </div>

      <div class="stavke-lista" id="stavke-lista"></div>
    </div>

    <button class="btn" id="btn-posalji" onclick="posaljiPonudu()">📤 Pošalji ponudu</button>
    <div id="msg"></div>
    <div id="posalji-box" style="margin-top:14px;"></div>
  </div>

  <!-- ═══ MOJE PONUDE ═══ -->
  <div class="view" id="view-moje">
    <div id="moje-lista"><div class="empty-msg">Učitavanje...</div></div>
  </div>

  <!-- ═══ ADMIN: ZA POTVRDU ═══ -->
  <div class="view" id="view-admin">
    <div id="admin-lista"><div class="empty-msg">Učitavanje...</div></div>
  </div>
</main>
<script>
const API='';
let me=null;
let objekti=[];
let trenutniTipStavke=null;
let lagerIzabranaRoba=null;
let stavke=[]; // {tip, ...}

function prebaciTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  if(tab==='moje') ucitajMojePonude();
  if(tab==='admin') ucitajAdminListu();
}

function izaberiTipStavke(tip){
  trenutniTipStavke=tip;
  document.getElementById('btn-tip-lager').classList.toggle('active', tip==='lager');
  document.getElementById('btn-tip-proizvodnja').classList.toggle('active', tip==='proizvodnja');
  document.getElementById('forma-lager').style.display=tip==='lager'?'block':'none';
  document.getElementById('forma-proizvodnja').style.display=tip==='proizvodnja'?'block':'none';
}

let lagerTimer=null;
function pretraziLager(){
  clearTimeout(lagerTimer);
  const objId=document.getElementById('objekat-select').value;
  const q=document.getElementById('lager-search').value.trim();
  const cont=document.getElementById('lager-rezultati');
  if(!objId){ cont.style.display='block'; cont.innerHTML='<div class="rez-item" style="color:var(--red);">Prvo izaberi prodajni objekat gore.</div>'; return; }
  if(q.length<2){ cont.style.display='none'; return; }
  lagerTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`${API}/api/roba?q=${encodeURIComponent(q)}&objekt_id=${objId}&limit=15`);
      const rows=await r.json();
      cont.style.display='block';
      if(!rows.length){ cont.innerHTML='<div class="rez-item">Nema rezultata.</div>'; return; }
      cont.innerHTML=rows.map(a=>`<div class="rez-item" onclick='izaberiLagerArtikal(${JSON.stringify(a).replace(/'/g,"&apos;")})'>
        <b>${esc(a.sifra)}</b> — ${esc(a.naziv)} <span style="color:#8b96a5;">(stanje: ${a.stanje ?? '—'} ${esc(a.jed_mjera||'')}, ${fm(a.cijena)} KM)</span>
      </div>`).join('');
    }catch(e){ cont.innerHTML='<div class="rez-item">Greška pri pretrazi.</div>'; }
  }, 250);
}

function izaberiLagerArtikal(a){
  lagerIzabranaRoba=a;
  document.getElementById('lager-rezultati').style.display='none';
  document.getElementById('lager-search').value='';
  document.getElementById('lager-izabrano').style.display='block';
  document.getElementById('lager-izabrano').textContent=`${a.sifra} — ${a.naziv} (raspoloživo: ${a.stanje ?? '—'} ${a.jed_mjera||''})`;
  document.getElementById('lager-cijena').value=a.cijena||0;
  document.getElementById('lager-kolicina').value='';
  document.getElementById('lager-kolicina').focus();
}

function dodajLagerStavku(){
  if(!lagerIzabranaRoba){ alert('Prvo izaberi artikal iz pretrage.'); return; }
  const kolicina=parseFloat(document.getElementById('lager-kolicina').value);
  const cijena=parseFloat(document.getElementById('lager-cijena').value);
  if(!(kolicina>0)){ alert('Unesite količinu veću od 0.'); return; }
  if(!(cijena>=0)){ alert('Unesite ispravnu cijenu.'); return; }
  stavke.push({
    tip:'lager', roba_id:lagerIzabranaRoba.id, sifra:lagerIzabranaRoba.sifra,
    naziv:lagerIzabranaRoba.naziv, jed_mjera:lagerIzabranaRoba.jed_mjera, kolicina, cijena,
    link_slika:document.getElementById('lager-slika').value.trim()||null,
  });
  lagerIzabranaRoba=null;
  document.getElementById('lager-izabrano').style.display='none';
  document.getElementById('lager-kolicina').value='';
  document.getElementById('lager-cijena').value='';
  document.getElementById('lager-slika').value='';
  renderStavke();
}

function dodajProizvodnjaStavku(){
  const zadatakIzabran=document.getElementById('pr-zadatak').value;
  const zadatak=zadatakIzabran==='__slobodno__'?document.getElementById('pr-zadatak-slobodno').value.trim():zadatakIzabran;
  if(!zadatak){ alert('Izaberite ili upišite zadatak.'); return; }
  const cijena=parseFloat(document.getElementById('pr-cijena').value)||0;
  stavke.push({
    tip:'proizvodnja', zadatak, materijal:document.getElementById('pr-materijal').value||null,
    napomena_stavka:document.getElementById('pr-napomena').value||null, cijena_proizvodnja:cijena,
    kategorija_bonus_id:document.getElementById('pr-kategorija').value||null,
  });
  document.getElementById('pr-zadatak').value='';
  document.getElementById('pr-zadatak-slobodno').value='';
  document.getElementById('pr-zadatak-slobodno').style.display='none';
  document.getElementById('pr-materijal').value='';
  document.getElementById('pr-kategorija').value='';
  document.getElementById('pr-napomena').value='';
  document.getElementById('pr-cijena').value='';
  renderStavke();
}

document.getElementById('pr-zadatak').addEventListener('change', function(){
  document.getElementById('pr-zadatak-slobodno').style.display=this.value==='__slobodno__'?'block':'none';
});

function ukloniStavku(idx){
  stavke.splice(idx,1);
  renderStavke();
}

function renderStavke(){
  const cont=document.getElementById('stavke-lista');
  if(!stavke.length){ cont.innerHTML=''; return; }
  cont.innerHTML=stavke.map((s,i)=>{
    if(s.tip==='lager'){
      return `<div class="stavka-red lager">
        <span>📦 ${esc(s.sifra)} — ${esc(s.naziv)} · ${s.kolicina} ${esc(s.jed_mjera||'')} × ${fm(s.cijena)} = <b>${fm(s.kolicina*s.cijena)} KM</b></span>
        <span class="ukloni" onclick="ukloniStavku(${i})">✕</span>
      </div>`;
    }
    return `<div class="stavka-red proizvodnja">
      <span>🔨 ${esc(s.zadatak)}${s.materijal?' · '+esc(s.materijal):''} — <b>${fm(s.cijena_proizvodnja)} KM</b></span>
      <span class="ukloni" onclick="ukloniStavku(${i})">✕</span>
    </div>`;
  }).join('');
}

async function posaljiPonudu(){
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btn-posalji');
  msg.style.display='none';
  document.getElementById('posalji-box').innerHTML='';
  const kupacNaziv=document.getElementById('kupac-naziv').value.trim();
  if(!kupacNaziv){ msg.className='err'; msg.style.display='block'; msg.textContent='✗ Unesite naziv kupca.'; return; }
  if(!stavke.length){ msg.className='err'; msg.style.display='block'; msg.textContent='✗ Dodajte bar jednu stavku.'; return; }
  const imaLager=stavke.some(s=>s.tip==='lager');
  const objId=document.getElementById('objekat-select').value;
  if(imaLager && !objId){ msg.className='err'; msg.style.display='block'; msg.textContent='✗ Izaberite prodajni objekat (ponuda ima stavke sa lagera).'; return; }
  if(document.getElementById('kupac-status').style.display==='none'){
    msg.className='err'; msg.style.display='block';
    msg.textContent='✗ Izaberite kupca iz pretrage, ili klikni "+ Dodaj kao novog kupca" ispod polja za ime.';
    return;
  }

  btn.disabled=true; btn.textContent='Slanje...';
  try{
    // Ako je označeno kao novi kupac, prvo ga upiši u bazu (da bude pretraživ ubuduće) —
    // greška pri registraciji ne smije spriječiti slanje ponude, samo se prijavljuje kao
    // upozorenje (novac/posao je bitniji od duplikata u šifrarniku).
    if(kupacJeNovi){
      try{
        const rk=await fetch(`${API}/api/kupci`,{
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            naziv:kupacNaziv,
            telefon:document.getElementById('kupac-telefon').value||null,
            adresa:document.getElementById('kupac-adresa').value||null,
            objekt_id:objId||null,
          }),
        });
      }catch(e){ /* tiho — registracija kupca je "nice to have", ne smije blokirati ponudu */ }
    }

    const r=await fetch(`${API}/api/terenske-ponude`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        kupac_naziv:kupacNaziv,
        kupac_telefon:document.getElementById('kupac-telefon').value||null,
        kupac_adresa:document.getElementById('kupac-adresa').value||null,
        objekt_id:objId||null,
        stavke,
        nacin_placanja:document.getElementById('nacin-placanja').value||null,
        valuta:document.getElementById('valuta-select').value,
        paritet:document.getElementById('paritet-select').value||null,
        paritet_adresa:document.getElementById('paritet-adresa').value||null,
        vreme_isporuke:document.getElementById('vreme-isporuke').value||null,
        vazi_do:document.getElementById('vazi-do').value||null,
      }),
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    msg.className='ok'; msg.style.display='block';
    msg.textContent=`✓ Ponuda #${d.id} poslata — čeka potvrdu.`;
    if(d.javni_token) document.getElementById('posalji-box').innerHTML=renderPosaljiDugmad(d.javni_token, d.id, document.getElementById('kupac-telefon').value, '');
    stavke=[]; renderStavke();
    document.getElementById('kupac-naziv').value='';
    document.getElementById('kupac-telefon').value='';
    document.getElementById('kupac-adresa').value='';
    document.getElementById('kupac-status').style.display='none';
    document.getElementById('nacin-placanja').value='';
    document.getElementById('paritet-select').value='';
    document.getElementById('paritet-adresa').value='';
    document.getElementById('paritet-adresa-fg').style.display='none';
    document.getElementById('vreme-isporuke').value='';
    document.getElementById('vazi-do').value='';
    kupacJeNovi=false;
  }catch(err){
    msg.className='err'; msg.style.display='block'; msg.textContent='✗ '+err.message;
  }finally{ btn.disabled=false; btn.textContent='📤 Pošalji ponudu'; }
}

function linkPonude(token){ return `${location.origin}/ponuda-dokument.html?token=${encodeURIComponent(token)}`; }
function renderPosaljiDugmad(token, id, telefon, email){
  const link=linkPonude(token);
  const poruka=encodeURIComponent(`Ponuda #${id} — JoPeX\n${link}`);
  const tel=(telefon||'').replace(/[^0-9+]/g,'');
  const waHref = tel ? `https://wa.me/${tel.replace(/^\+/,'')}?text=${poruka}` : `https://wa.me/?text=${poruka}`;
  const viberHref = `viber://forward?text=${poruka}`;
  const mailHref = `mailto:${email||''}?subject=${encodeURIComponent('Ponuda #'+id+' — JoPeX')}&body=${poruka}`;
  return `
    <div class="card">
      <div class="posalji-lbl">Pošalji ponudu kupcu</div>
      <div class="posalji-btns">
        <a class="btn-posalji viber" href="${viberHref}"><span class="ic">📱</span>Viber</a>
        <a class="btn-posalji whatsapp" href="${waHref}" target="_blank" rel="noopener"><span class="ic">💬</span>WhatsApp</a>
        <a class="btn-posalji email" href="${mailHref}"><span class="ic">✉️</span>Email</a>
      </div>
      <div class="posalji-link">${esc(link)}</div>
    </div>
  `;
}

function statusBadge(status){
  const mapa={poslato:['Čeka potvrdu','st-poslato'], potvrdjeno:['Potvrđeno','st-potvrdjeno'], otkazano:['Otkazano','st-otkazano']};
  const [tekst,klasa]=mapa[status]||[status,''];
  return `<span class="ponuda-status ${klasa}">${tekst}</span>`;
}

async function ucitajAdminListu(){

  try{

async function potvrdiPonudu(id){
  if(!confirm('Potvrditi ponudu? Ovo generiše otpremnicu i/ili radni nalog i skida robu sa lagera (ako ima lager stavki).')) return;
  try{
    const r=await fetch(`${API}/api/terenske-ponude/${id}/potvrdi`,{method:'POST'});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    alert('✓ Potvrđeno.'+(d.otpremnica_id?' Otpremnica kreirana.':'')+(d.radni_nalog_r_br?' Radni nalog #'+d.radni_nalog_r_br+' kreiran.':''));
    ucitajAdminListu();
  }catch(e){ alert('✗ '+e.message); }
}

async function otkaziPonudu(id){
  if(!confirm('Otkazati ovu ponudu?')) return;
  try{
    const r=await fetch(`${API}/api/terenske-ponude/${id}/otkazi`,{method:'POST'});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    ucitajAdminListu();
  }catch(e){ alert('✗ '+e.message); }
}

let kupacTimer=null, kupacIzabranId=null, kupacJeNovi=false;

function pretraziKupca(){
  clearTimeout(kupacTimer);
  kupacIzabranId=null;
  kupacJeNovi=false;
  document.getElementById('kupac-status').style.display='none';
  const q=document.getElementById('kupac-naziv').value.trim();
  const cont=document.getElementById('kupac-rezultati');
  if(q.length<2){ cont.style.display='none'; return; }
  kupacTimer=setTimeout(async()=>{
    try{
      const objId=document.getElementById('objekat-select').value;
      const r=await fetch(`${API}/api/kupci?q=${encodeURIComponent(q)}&limit=10&objekt_id=${objId||''}`);
      const rows=await r.json();
      cont.style.display='block';
      if(!rows.length){
        cont.innerHTML=`<div class="rez-item" style="color:#8b96a5;">Nema rezultata za "${esc(q)}".</div>
          <div class="rez-item" style="color:var(--blue);font-weight:700;" onclick="oznaciKaoNovogKupca()">+ Dodaj "${esc(q)}" kao novog kupca</div>`;
        return;
      }
      cont.innerHTML=rows.map(k=>`<div class="rez-item" onclick='izaberiPostojecegKupca(${JSON.stringify(k).replace(/'/g,"&apos;")})'>
        <b>${esc(k.naziv)}</b>${k.telefon?' · '+esc(k.telefon):''}
      </div>`).join('')+`<div class="rez-item" style="color:var(--blue);font-weight:700;" onclick="oznaciKaoNovogKupca()">+ Ipak dodaj "${esc(q)}" kao NOVOG kupca</div>`;
    }catch(e){ cont.innerHTML='<div class="rez-item">Greška pri pretrazi.</div>'; }
  }, 250);
}

/* ═══ Katalog sa slikama ═══════════════════════════════════════════════════
   Cita postojeci ERP endpoint /api/roba/lager-prodaja (isti koji koristi
   maloprodaja) — nista novo na serveru. Izbor artikla ide kroz postojecu
   funkciju izaberiLagerArtikal(), pa se ostatak forme ponasa isto kao da je
   artikal nadjen pretragom. */
let katSvi=[];          // svi artikli izabranog objekta
let katObjekat=null;    // za koji objekat su ucitani
let katOtvorena=null;   // trenutno uvecana ciglica

async function otvoriKatalog(){
  const objId=document.getElementById('objekat-select').value;
  if(!objId){ alert('Prvo izaberi prodajni objekat gore.'); return; }

  let preko=document.getElementById('kat-preko');
  if(!preko){
    preko=document.createElement('div');
    preko.id='kat-preko';
    preko.className='kat-preko';
    preko.innerHTML=
      '<div class="kat-vrh">'+
        '<input type="text" id="kat-trazi" placeholder="Pretraga: naziv ili šifra" oninput="katNacrtaj()">'+
        '<select id="kat-grupa" onchange="katNacrtaj()"></select>'+
        '<button class="kat-zatvori" onclick="zatvoriKatalog()" aria-label="Zatvori">×</button>'+
        '<label class="kat-brojac"><input type="checkbox" id="kat-samo-stanje" checked onchange="katNacrtaj()" style="vertical-align:-2px"> samo na stanju &nbsp;·&nbsp; <span id="kat-broj"></span></label>'+
      '</div>'+
      '<div class="kat-tijelo"><div class="kat-mreza" id="kat-mreza"></div></div>';
    document.body.appendChild(preko);
  }
  preko.classList.add('otvoren');
  document.body.style.overflow='hidden';

  if(katObjekat!==objId){
    document.getElementById('kat-mreza').innerHTML='<div class="empty-msg">Učitavanje…</div>';
    try{
      const r=await fetch(API+'/api/roba/lager-prodaja?objekt_id='+encodeURIComponent(objId));
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Greška');
      katSvi=d.stavke||[];
      katObjekat=objId;
    }catch(e){
      document.getElementById('kat-mreza').innerHTML='<div class="empty-msg">Greška: '+esc(e.message)+'</div>';
      return;
    }
    const grupe=[...new Set(katSvi.map(a=>a.grupa).filter(Boolean))].sort();
    document.getElementById('kat-grupa').innerHTML=
      '<option value="">sve kolekcije</option>'+grupe.map(g=>'<option>'+esc(g)+'</option>').join('');
  }
  katNacrtaj();
}

function zatvoriKatalog(){
  const p=document.getElementById('kat-preko');
  if(p) p.classList.remove('otvoren');
  document.body.style.overflow='';
}

function katNacrtaj(){
  const q=(document.getElementById('kat-trazi').value||'').trim().toLowerCase();
  const grupa=document.getElementById('kat-grupa').value;
  const samoStanje=document.getElementById('kat-samo-stanje').checked;

  const lista=katSvi.filter(a=>{
    if(samoStanje && !(Number(a.stanje)>0)) return false;
    if(grupa && a.grupa!==grupa) return false;
    if(q && !((a.naziv||'')+' '+(a.sifra||'')).toLowerCase().includes(q)) return false;
    return true;
  });

  // Artikli sa slikom idu naprijed — zbog njih se katalog i otvara.
  lista.sort((x,y)=>(y.glavna_slika?1:0)-(x.glavna_slika?1:0)||String(x.naziv).localeCompare(String(y.naziv)));

  document.getElementById('kat-broj').textContent=lista.length+' od '+katSvi.length+' artikala';
  const m=document.getElementById('kat-mreza');
  if(!lista.length){ m.innerHTML='<div class="empty-msg">Nema artikala za te uslove.</div>'; return; }

  m.innerHTML=lista.map(a=>{
    const nema=!(Number(a.stanje)>0);
    return '<button type="button" class="kat-cigla'+(a.glavna_slika?'':' bez-slike')+'" data-id="'+a.id+'"'+
      (a.glavna_slika?' style="background-image:url(\''+esc(a.glavna_slika)+'\')"':'')+'>'+
      '<span class="veo"></span>'+
      (a.grupa?'<span class="zn">'+esc(a.grupa)+'</span>':'')+
      '<span class="st'+(nema?' nema':'')+'">'+(nema?'nema':fm(a.stanje)+' '+esc(a.jed_mjera||''))+'</span>'+
      '<span class="txt"><span class="ime">'+esc(a.naziv)+'</span>'+
      '<span class="c">'+fm(a.cijena)+' <small>KM / '+esc(a.jed_mjera||'')+'</small></span></span>'+
    '</button>';
  }).join('');

  m.querySelectorAll('.kat-cigla').forEach(el=>{
    el.onclick=()=>katUvecaj(katSvi.find(x=>String(x.id)===el.dataset.id), el);
  });
}

/* Ciglica naraste do punog ekrana — da se kupcu pokaze kamen izbliza.
   Animira se samo transform (FLIP), pa je gladko i na starijem telefonu. */
function katUvecaj(a, izvor){
  if(katOtvorena||!a) return;
  const mirno=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const p=izvor.getBoundingClientRect();
  const M=12, visina=Math.min(innerHeight*0.52, innerWidth*0.5);
  const kraj={left:M, top:M, width:innerWidth-2*M, height:visina};

  const poz=document.createElement('div'); poz.className='kat-zum-pozadina';
  const let_=document.createElement('div'); let_.className='kat-let';
  let_.style.backgroundImage=getComputedStyle(izvor).backgroundImage;
  Object.assign(let_.style,{left:kraj.left+'px',top:kraj.top+'px',
    width:kraj.width+'px',height:kraj.height+'px'});
  const sx=p.width/kraj.width, sy=p.height/kraj.height;
  let_.style.transform='translate('+(p.left-kraj.left)+'px,'+(p.top-kraj.top)+'px) scale('+sx+','+sy+')';

  const panel=document.createElement('div'); panel.className='kat-panel';
  panel.innerHTML='<h3>'+esc(a.naziv)+'</h3>'+
    '<div class="meta">Šifra '+esc(a.sifra)+(a.debljina_cm?' · '+fm(a.debljina_cm)+' cm':'')+
      ' · raspoloživo '+fm(a.stanje)+' '+esc(a.jed_mjera||'')+'</div>'+
    '<div class="cijena">'+fm(a.cijena)+' KM <span style="font-size:13px;font-weight:500;color:#6b7a8d">/ '+esc(a.jed_mjera||'')+'</span></div>'+
    '<button type="button" class="btn" id="kat-izaberi">✓ Izaberi ovaj artikal</button>';

  const x=document.createElement('button'); x.className='kat-zum-zatvori'; x.innerHTML='×';

  document.body.append(poz,let_,panel,x);
  katOtvorena={poz,let_,panel,x,izvor};
  requestAnimationFrame(()=>poz.classList.add('vidljiva'));

  const anim=let_.animate(
    [{transform:let_.style.transform,borderRadius:'8.34% / 16.68%'},
     {transform:'none',borderRadius:'12px'}],
    {duration:mirno?1:420,easing:'cubic-bezier(.22,.9,.28,1.04)',fill:'forwards'});

  // Prikaz ne smije da zavisi od kraja animacije — u pozadinskoj kartici je
  // vrijeme zamrznuto, pa bi obecanje "finished" umjelo da ne stigne nikad.
  Promise.race([anim.finished.catch(()=>{}), new Promise(r=>setTimeout(r,mirno?10:520))])
    .then(()=>{ if(katOtvorena) panel.classList.add('vidljiv'); });

  panel.querySelector('#kat-izaberi').onclick=()=>{
    izaberiLagerArtikal(a);
    katZatvoriZum();
    zatvoriKatalog();
  };
  x.onclick=katZatvoriZum;
  poz.onclick=katZatvoriZum;
}

async function katZatvoriZum(){
  if(!katOtvorena) return;
  const {poz,let_,panel,x,izvor}=katOtvorena;
  katOtvorena=null;
  const mirno=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  panel.classList.remove('vidljiv');
  poz.classList.remove('vidljiva');

  const nazad=izvor.getBoundingClientRect();
  const sad=let_.getBoundingClientRect();
  const a=let_.animate(
    [{transform:'none',borderRadius:'12px'},
     {transform:'translate('+(nazad.left-sad.left)+'px,'+(nazad.top-sad.top)+'px) scale('+
       (nazad.width/(sad.width||1))+','+(nazad.height/(sad.height||1))+')',
      borderRadius:'8.34% / 16.68%'}],
    {duration:mirno?1:320,easing:'cubic-bezier(.4,0,.3,1)',fill:'forwards'});

  await Promise.race([a.finished.catch(()=>{}), new Promise(r=>setTimeout(r,mirno?10:400))]);
  [poz,let_,panel,x].forEach(e=>e.remove());
}

// Promjena poslovnice mijenja i cjenovnik i stanje — katalog se mora ponovo ucitati.
document.getElementById('objekat-select').addEventListener('change',()=>{ katObjekat=null; });

checkAuth();
ucitajObjekte();
ucitajMaterijale();
</script>
