<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kupci – JoPeX</title>
<style>
:root{--blue:#1a5fa8;--dark:#134a85;--bg:#f0f2f5;--border:#d0d7de;--green:#1f8a4c;--red:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);font-size:12.5px;}
header{background:var(--blue);color:#fff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:14px;font-weight:700;}
header nav a{color:#fff;text-decoration:none;font-size:11px;border:1px solid rgba(255,255,255,.4);padding:3px 8px;border-radius:4px;margin-left:8px;}
main{max-width:1100px;margin:20px auto;padding:0 14px;}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.toolbar input{font:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:5px;min-width:220px;}
.btn{font:inherit;font-size:12px;padding:6px 14px;border-radius:5px;border:none;cursor:pointer;font-weight:600;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--dark);}
.btn-sec{background:#eee;color:#333;}
#stat{font-size:11px;color:#6b7a8d;margin-left:auto;}

/* TABELA */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{background:#1f3864;color:#fff;font-size:11.5px;font-weight:600;padding:8px 10px;text-align:left;white-space:nowrap;}
tbody tr:hover td{background:#f0f4ff;}
tbody tr:nth-child(even) td{background:#f8f9fc;}
td{padding:7px 10px;border-bottom:1px solid #eee;vertical-align:middle;}
td.ime{font-weight:700;color:var(--dark);}
.badge-neaktivan{display:inline-block;background:#fce8e6;color:var(--red);font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px;}
.saved{color:var(--green);font-size:11px;}
.edit-inp{font:inherit;font-size:11.5px;padding:3px 6px;border:1px solid #ddd;border-radius:4px;width:100%;}
.edit-inp:focus{outline:none;border-color:var(--blue);}

/* TOGGLE */
.toggle{position:relative;display:inline-block;width:36px;height:20px;}
.toggle input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:20px;transition:.3s;}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
input:checked+.slider{background:var(--green);}
input:checked+.slider:before{transform:translateX(16px);}
.toggle-cell{text-align:center;}

/* MODAL — novi kupac */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;}
.modal.on{display:flex;}
.modal-box{background:#fff;border-radius:10px;padding:24px;min-width:360px;max-width:500px;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.modal-box h3{margin-bottom:16px;font-size:15px;color:var(--dark);}
.fg{margin-bottom:10px;}
.fg label{display:block;font-size:11px;font-weight:600;color:#6b7a8d;margin-bottom:3px;}
.fg input,.fg textarea{width:100%;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:5px;}
.fg textarea{resize:vertical;min-height:60px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.modal-btns button{flex:1;font:inherit;font-size:12px;padding:8px;border-radius:5px;border:none;cursor:pointer;font-weight:600;}
.btn-save{background:var(--blue);color:#fff;}
.btn-cancel{background:#eee;color:#333;}
.msg{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:4px;}
.msg.ok{background:#e6f4ea;color:var(--green);}
.msg.err{background:#fce8e6;color:var(--red);}
.empty{text-align:center;padding:30px;color:#999;}
.editabilno{cursor:pointer;}
.editabilno:hover{background:#eef4fc !important;}
.prazno{color:#bbb;}

/* Inline popup — isti obrazac kao u lista.html */
#inline-pop{display:none;position:absolute;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:10px;z-index:200;width:230px;}
#inline-pop label{display:block;font-size:10.5px;font-weight:700;color:#6b7a8d;margin-bottom:4px;}
#inline-pop input{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:5px;}
#inline-pop .pop-btns{display:flex;gap:6px;margin-top:8px;}
#inline-pop .pop-btns button{flex:1;font:inherit;font-size:11px;padding:6px;border-radius:5px;border:none;cursor:pointer;font-weight:600;}
#inline-pop .btn-save{background:var(--blue);color:#fff;}
#inline-pop .btn-cancel{background:#eee;color:#333;}
</style>
</head>
<body>
<header>
  <h1><img src="logo-bijeli.png" alt="JoPeX" style="height:30px;vertical-align:middle;margin-right:8px;">Kupci</h1>
  <nav>
    <a href="home.html">← Početna</a>
    <a href="#" id="logout">Izlaz</a>
  </nav>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 Pretraži po nazivu, telefonu, gradu..." oninput="render()">
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7a8d;cursor:pointer;">
      <input type="checkbox" id="fil-neaktivni" onchange="render()"> Prikaži neaktivne
    </label>
    <select id="fil-izvor" onchange="render()" style="padding:6px 9px;border:1px solid #ddd;border-radius:6px;font-size:12.5px;">
      <option value="">— cijela baza —</option>
      <option value="uvoz">📦 Uvezeni (zatečena baza)</option>
      <option value="sistem">✨ Kroz rad (nastali u sistemu)</option>
    </select>
    <select id="fil-razvrstan" onchange="render()" style="padding:6px 9px;border:1px solid #ddd;border-radius:6px;font-size:12.5px;">
      <option value="">— svi —</option>
      <option value="ne">⏳ Za razvrstavanje</option>
      <option value="da">✓ Razvrstani</option>
    </select>
    <select id="fil-tip" onchange="render()" style="padding:6px 9px;border:1px solid #ddd;border-radius:6px;font-size:12.5px;">
      <option value="">— svi tipovi —</option>
    </select>
    <button class="btn btn-primary" onclick="openModal()">+ Novi kupac</button>
    <span id="stat"></span>
  </div>

  <!-- Grupna dodjela tipa — za brzo razvrstavanje veceg spiska kupaca odjednom -->
  <!-- Grupna izmjena — jedna vrijednost se upisuje SVIM oznacenim kupcima odjednom.
       Korisno pri razvrstavanju vece uvezene baze (npr. 40 kupaca iz istog grada). -->
  <div id="grupna-traka" style="display:none;background:#eef4fc;border:1px solid #b8d4f0;border-radius:8px;padding:10px 12px;margin-bottom:12px;align-items:center;gap:10px;flex-wrap:wrap;">
    <b style="font-size:13px;white-space:nowrap;"><span id="grupna-broj">0</span> izabranih</b>
    <span style="color:#8b96a5;font-size:12.5px;">Postavi</span>
    <select id="grupna-polje" onchange="grupnaPromjenaPolja()" style="padding:6px 9px;border:1px solid #ddd;border-radius:6px;font-size:12.5px;">
      <option value="tip_id">Tip kupca (zamjenjuje postojeće)</option>
      <option value="grad">Grad</option>
      <option value="adresa">Adresa</option>
      <option value="napomena">Napomena</option>
      <option value="aktivan">Status (aktivan)</option>
      <option value="razvrstan">Oznaka „razvrstan"</option>
    </select>
    <span style="color:#8b96a5;font-size:12.5px;">na</span>
    <select id="grupna-tip" style="padding:6px 9px;border:1px solid #ddd;border-radius:6px;font-size:12.5px;">
      <option value="">— izaberi tip —</option>
    </select>
    <select id="grupna-bool" style="display:none;padding:6px 9px;border:1px solid #ddd;border-radius:6px;font-size:12.5px;">
      <option value="true">Da</option>
      <option value="false">Ne</option>
    </select>
    <input type="text" id="grupna-tekst" style="display:none;padding:6px 9px;border:1px solid #ddd;border-radius:6px;font-size:12.5px;min-width:180px;" placeholder="Upiši vrijednost...">
    <button class="btn btn-primary" onclick="grupnoPrimijeni()" style="font-size:12.5px;">✓ Primijeni</button>
    <button class="btn" onclick="ponistiIzbor()" style="font-size:12.5px;">Poništi izbor</button>
    <div id="grupna-status" style="font-size:12px;width:100%;display:none;"></div>
  </div>
  <div class="card" id="tabela-wrap">
    <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th style="width:26px;text-align:center;"><input type="checkbox" id="chk-svi" onchange="oznaciSveVidljive(this.checked)" title="Izaberi sve prikazane"></th>
          <th>Naziv / Ime</th>
          <th>Tip kupca</th>
          <th>Telefon</th>
          <th>Grad</th>
          <th>Adresa</th>
          <th>Email</th>
          <th>Napomena</th>
          <th style="text-align:center">Aktivan</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="10" class="empty">Učitavanje...</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</main>

<!-- Inline popup editor - klik na ćeliju otvara ovo, umjesto direktne izmjene -->
<div id="inline-pop">
  <label id="pop-label">Vrijednost</label>
  <input type="text" id="pop-inp">
  <div class="pop-btns">
    <button class="btn-save" onclick="popSave()">✓ Sačuvaj</button>
    <button class="btn-cancel" onclick="popClose()">✗ Otkaži</button>
  </div>
</div>

<!-- Modal novi kupac -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>+ Novi kupac</h3>
    <div class="fg"><label>Naziv / Ime *</label><input type="text" id="n-naziv" placeholder="Mika Petrović ili Firma d.o.o."></div>
    <div class="r2">
      <div class="fg"><label>Telefon</label><input type="text" id="n-tel" placeholder="+387 6X XXX XXX"></div>
      <div class="fg"><label>Grad</label><input type="text" id="n-grad" placeholder="Banja Luka"></div>
    </div>
    <div class="fg"><label>Adresa</label><input type="text" id="n-adr" placeholder="Ulica bb"></div>
    <div class="fg"><label>Email</label><input type="email" id="n-email" placeholder="kupac@email.com"></div>
    <div class="fg"><label>Napomena</label><textarea id="n-nap" placeholder="Interna napomena..."></textarea></div>
    <div id="modal-msg"></div>
    <div class="modal-btns">
      <button class="btn-save" onclick="sacuvajNovog()">✓ Sačuvaj</button>
      <button class="btn-cancel" onclick="closeModal()">Otkaži</button>
    </div>
  </div>
</div>

<script>
const API='';
let kupci=[], isAdmin=false;

function esc(s){return s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ═══ TIPOVI KUPACA ═══
   Tip odredjuje CIJENU u katalogu (popust % i da li se dodaje PDV). Odvojeno od
   kupci_grupe (BiH/Nis) koja odredjuje geografsku vidljivost. */
let tipovi=[];
let izabraniKupci=new Set();  // za grupnu dodjelu tipa vecem broju kupaca odjednom

async function ucitajTipove(){
  try{
    const r=await fetch(API+'/api/cijene/tipovi');
    const d=await r.json();
    if(!r.ok) return;
    tipovi=d.tipovi||[];
    const opcije=tipovi.map(t=>`<option value="${t.id}">${esc(t.naziv)}${t.dodaje_pdv?' (+PDV)':t.popust_posto>0?` (−${t.popust_posto}%)`:''}</option>`).join('');
    document.getElementById('fil-tip').innerHTML='<option value="">— svi tipovi —</option><option value="0">— bez tipa —</option>'+opcije;
    document.getElementById('grupna-tip').innerHTML='<option value="">— izaberi tip —</option>'+opcije;
  }catch(e){}
}

// Padajuca lista tipa u svakom redu — promjena se odmah snima.
// Kupac moze imati VISE tipova (npr. i kamenorezac i vlasnik salona) — prikazuju se kao
// oznake, klik otvara izbor sa kvadraticima.
function tipSelect(k){
  const moji=(k.tip_ids||[]).map(id=>tipovi.find(t=>t.id===id)).filter(Boolean);
  if(!moji.length){
    return `<button onclick="otvoriIzborTipova(${k.id})" style="padding:3px 8px;border:1px solid #e0a800;border-radius:5px;font-size:11px;background:#fff8e1;cursor:pointer;color:#8b6914;">+ dodijeli tip</button>`;
  }
  return `<span onclick="otvoriIzborTipova(${k.id})" style="cursor:pointer;display:inline-flex;gap:3px;flex-wrap:wrap;" title="Klikni da izmijeniš">
    ${moji.map(t=>`<span style="background:#eef4fc;color:#1a5fa8;border:1px solid #b8d4f0;border-radius:10px;padding:1px 7px;font-size:10.5px;white-space:nowrap;">${esc(t.naziv)}</span>`).join('')}
  </span>`;
}

// Prozorcic sa kvadraticima — bira se vise tipova odjednom.
let izborTipovaKupacId=null;
function otvoriIzborTipova(kupacId){
  izborTipovaKupacId=kupacId;
  const k=kupci.find(x=>x.id===kupacId);
  const moji=new Set(k?.tip_ids||[]);
  document.getElementById('izbor-tipova-naziv').textContent=k?.naziv||'';
  document.getElementById('izbor-tipova-lista').innerHTML=tipovi.map(t=>`
    <label style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #f0f2f5;cursor:pointer;font-size:13px;">
      <input type="checkbox" value="${t.id}" ${moji.has(t.id)?'checked':''}>
      <span>${esc(t.naziv)}</span>
      <span style="margin-left:auto;color:#8b96a5;font-size:11px;">${t.dodaje_pdv?'+PDV':t.popust_posto>0?`−${t.popust_posto}%`:'—'}</span>
    </label>`).join('');
  document.getElementById('modal-izbor-tipova').style.display='flex';
}

async function sacuvajIzborTipova(){
  const izabrani=[...document.querySelectorAll('#izbor-tipova-lista input:checked')].map(i=>parseInt(i.value));
  try{
    const r=await fetch(`${API}/api/config/kupci/${izborTipovaKupacId}`,{
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tip_ids:izabrani, razvrstan:izabrani.length>0}),
    });
    if(!r.ok) throw new Error();
    const k=kupci.find(x=>x.id===izborTipovaKupacId);
    if(k){ k.tip_ids=izabrani; k.razvrstan=izabrani.length>0; }
    document.getElementById('modal-izbor-tipova').style.display='none';
    render();
  }catch(e){ alert('✗ Greška pri snimanju.'); }
}

// Dodjela tipa AUTOMATSKI oznacava kupca kao razvrstanog — jedan klik umjesto dva.
async function dodijeliTip(id, vrijednost){
  const tipId = vrijednost ? parseInt(vrijednost) : null;
  try{
    const r=await fetch(`${API}/api/config/kupci/${id}`,{
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tip_id:tipId, razvrstan:tipId!==null}),
    });
    if(!r.ok) throw new Error();
    const k=kupci.find(x=>x.id===id);
    if(k){ k.tip_id=tipId; k.razvrstan=tipId!==null; }
    render();
  }catch(e){ alert('✗ Greška pri snimanju.'); }
}

// Rucno oznacavanje "prosao sam ovog kupca" — da se zna dokle se stiglo.
async function oznaciRazvrstan(id, vrijednost){
  try{
    const r=await fetch(`${API}/api/config/kupci/${id}`,{
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({razvrstan:vrijednost}),
    });
    if(!r.ok) throw new Error();
    const k=kupci.find(x=>x.id===id); if(k) k.razvrstan=vrijednost;
    render();
  }catch(e){ alert('✗ Greška pri snimanju.'); }
}

function oznaciKupca(id, oznaceno){
  if(oznaceno) izabraniKupci.add(id); else izabraniKupci.delete(id);
  osvjeziGrupnuTraku();
  render();
}
function oznaciSveVidljive(oznaceno){
  vidljiviKupci().forEach(k=>{ if(oznaceno) izabraniKupci.add(k.id); else izabraniKupci.delete(k.id); });
  osvjeziGrupnuTraku();
  render();
}
function ponistiIzbor(){ izabraniKupci.clear(); osvjeziGrupnuTraku(); render(); }
function osvjeziGrupnuTraku(){
  const traka=document.getElementById('grupna-traka');
  traka.style.display = izabraniKupci.size ? 'flex' : 'none';
  document.getElementById('grupna-broj').textContent=izabraniKupci.size;
}

/* ── GRUPNA IZMJENA ──
   Jedna vrijednost se upisuje SVIM oznacenim kupcima. Polje se bira iz padajuce liste,
   pa se prikazuje odgovarajuci unos (padajuca lista za tip/da-ne, tekst za grad/adresu). */
const GRUPNA_POLJA={
  tip_id:    {lbl:'Tip kupca',            unos:'tip'},
  grad:      {lbl:'Grad',                 unos:'tekst'},
  adresa:    {lbl:'Adresa',               unos:'tekst'},
  napomena:  {lbl:'Napomena',             unos:'tekst'},
  aktivan:   {lbl:'Status (aktivan)',     unos:'bool'},
  razvrstan: {lbl:'Oznaka „razvrstan"',   unos:'bool'},
};

function grupnaPromjenaPolja(){
  const polje=document.getElementById('grupna-polje').value;
  const unos=GRUPNA_POLJA[polje].unos;
  document.getElementById('grupna-tip').style.display   = unos==='tip'   ? '' : 'none';
  document.getElementById('grupna-bool').style.display  = unos==='bool'  ? '' : 'none';
  document.getElementById('grupna-tekst').style.display = unos==='tekst' ? '' : 'none';
  document.getElementById('grupna-status').style.display='none';
}

async function grupnoPrimijeni(){
  const polje=document.getElementById('grupna-polje').value;
  const cfg=GRUPNA_POLJA[polje];
  let vrijednost, opis;

  if(cfg.unos==='tip'){
    const tipId=document.getElementById('grupna-tip').value;
    if(!tipId){ alert('Izaberi tip koji dodjeljuješ.'); return; }
    vrijednost=parseInt(tipId);
    opis=tipovi.find(t=>t.id===vrijednost)?.naziv||'';
  }else if(cfg.unos==='bool'){
    vrijednost=document.getElementById('grupna-bool').value==='true';
    opis=vrijednost?'Da':'Ne';
  }else{
    vrijednost=document.getElementById('grupna-tekst').value.trim();
    if(!vrijednost){ alert('Upiši vrijednost.'); return; }
    opis=vrijednost;
  }

  if(!confirm(`Postaviti "${cfg.lbl}" na "${opis}" za ${izabraniKupci.size} kupaca?`)) return;

  const status=document.getElementById('grupna-status');
  status.style.display='block'; status.style.color='#8b96a5';
  let ok=0, greske=0, i=0;
  for(const id of izabraniKupci){
    status.textContent=`Snimanje ${++i}/${izabraniKupci.size}...`;
    // Dodjela tipa istovremeno oznacava kupca kao razvrstanog (jedan korak manje).
    const tijelo = polje==='tip_id' ? {tip_ids:[vrijednost], razvrstan:true} : {[polje]:vrijednost};
    try{
      const r=await fetch(`${API}/api/config/kupci/${id}`,{
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(tijelo),
      });
      if(r.ok){
        ok++;
        const k=kupci.find(x=>x.id===id);
        if(k){ if(tijelo.tip_ids) k.tip_ids=tijelo.tip_ids; Object.assign(k, tijelo); }
      } else greske++;
    }catch(e){ greske++; }
  }
  status.style.color = greske ? 'var(--red,#c0392b)' : 'var(--green,#1f8a4c)';
  status.textContent = `✓ Izmijenjeno: ${ok}${greske?` · ✗ neuspješno: ${greske}`:''}`;
  izabraniKupci.clear();
  render();
  setTimeout(()=>{ osvjeziGrupnuTraku(); }, 1800);
}

async function load(){
  try{
    await ucitajTipove();
    const r=await fetch(API+'/api/config/kupci');
    if(!r.ok) throw new Error();
    kupci=await r.json();
    render();
  }catch(e){
    document.getElementById('tbody').innerHTML='<tr><td colspan="10" class="empty">Greška pri učitavanju.</td></tr>';
  }
}

// Izdvojeno da isti filter koriste i prikaz i "izaberi sve prikazane".
function vidljiviKupci(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const prikaziNeakt=document.getElementById('fil-neaktivni').checked;
  const filTip=document.getElementById('fil-tip').value;
  return kupci.filter(k=>{
    if(!prikaziNeakt && k.aktivan===false) return false;
    if(q && !['naziv','telefon','grad','adresa','email'].some(f=>k[f]&&String(k[f]).toLowerCase().includes(q))) return false;
    if(filTip==='0' && (k.tip_ids||[]).length) return false;   // "bez tipa"
    if(filTip && filTip!=='0' && !(k.tip_ids||[]).includes(parseInt(filTip))) return false;
    const filIzvor=document.getElementById('fil-izvor').value;
    if(filIzvor && (k.izvor||'uvoz')!==filIzvor) return false;
    const filRazvrstan=document.getElementById('fil-razvrstan').value;
    if(filRazvrstan==='da' && !k.razvrstan) return false;
    if(filRazvrstan==='ne' && k.razvrstan) return false;
    return true;
  });
}

function render(){
  let rows=vidljiviKupci();
  const aktivni=kupci.filter(k=>k.aktivan!==false);
  const zaRazvrstavanje=aktivni.filter(k=>!k.razvrstan).length;
  const uvezeni=aktivni.filter(k=>(k.izvor||'uvoz')==='uvoz').length;
  const izSistema=aktivni.length-uvezeni;
  const napredak=aktivni.length?Math.round((aktivni.length-zaRazvrstavanje)/aktivni.length*100):100;
  document.getElementById('stat').innerHTML=
    `<b>${rows.length}</b> / ${kupci.length} kupaca`
    +` <span style="color:#8b96a5;">· 📦 ${uvezeni} uvezenih · ✨ ${izSistema} kroz rad</span>`
    +(zaRazvrstavanje
      ? ` <span style="color:#e0a800;font-weight:700;">· ⏳ ${zaRazvrstavanje} za razvrstavanje (${napredak}% gotovo)</span>`
      : ` <span style="color:var(--green,#1f8a4c);font-weight:700;">· ✓ svi razvrstani</span>`);
  if(!rows.length){
    document.getElementById('tbody').innerHTML='<tr><td colspan="10" class="empty">Nema kupaca.</td></tr>';
    return;
  }
  // Ćelije su SAMO tekst, klikabilne — otvaraju mali popup sa poljem i dugmetom "Sačuvaj"
  // (ne mijenja se odmah pri gubljenju fokusa) — sprečava da se slučajno pokvari podatak
  // jednim nepažljivim klikom/dodirom.
  document.getElementById('tbody').innerHTML=rows.map(k=>`
    <tr id="row-${k.id}" style="${izabraniKupci.has(k.id)?'background:#eaf4ea;':''}">
      <td style="text-align:center;"><input type="checkbox" ${izabraniKupci.has(k.id)?'checked':''} onchange="oznaciKupca(${k.id},this.checked)"></td>
      <td class="ime editabilno" onclick="otvoriPopup(${k.id},'naziv','Naziv / Ime',this)">
        ${(k.izvor||'uvoz')==='sistem'?'<span title="Nastao kroz rad u sistemu" style="font-size:10px;">✨ </span>':''}${esc(k.naziv)}${k.aktivan===false?'<span class="badge-neaktivan">NEAKTIVAN</span>':''}
      </td>
      <td style="white-space:nowrap;">
        ${tipSelect(k)}
        <button onclick="oznaciRazvrstan(${k.id}, ${!k.razvrstan})" title="${k.razvrstan?'Označeno kao razvrstano — klikni da poništiš':'Označi da si prošao ovog kupca'}" style="border:none;background:none;cursor:pointer;font-size:14px;padding:0 2px;">${k.razvrstan?'✓':'○'}</button>
      </td>
      <td class="editabilno" onclick="otvoriPopup(${k.id},'telefon','Telefon',this)">${esc(k.telefon)||'<span class="prazno">—</span>'}</td>
      <td class="editabilno" onclick="otvoriPopup(${k.id},'grad','Grad',this)">${esc(k.grad)||'<span class="prazno">—</span>'}</td>
      <td class="editabilno" onclick="otvoriPopup(${k.id},'adresa','Adresa',this)">${esc(k.adresa)||'<span class="prazno">—</span>'}</td>
      <td class="editabilno" onclick="otvoriPopup(${k.id},'email','Email',this)">${esc(k.email)||'<span class="prazno">—</span>'}</td>
      <td class="editabilno" onclick="otvoriPopup(${k.id},'napomena','Napomena',this)">${esc(k.napomena)||'<span class="prazno">—</span>'}</td>
      <td class="toggle-cell">
        <label class="toggle">
          <input type="checkbox" ${k.aktivan!==false?'checked':''} onchange="sacuvajPolje(${k.id},'aktivan',this.checked)">
          <span class="slider"></span>
        </label>
      </td>
      <td><span class="saved" id="saved-${k.id}"></span></td>
    </tr>
  `).join('');
}

// Ime/naziv je jedino polje koje NE SMIJE biti prazno (za razliku od telefona, grada,
// itd.) — ako neko slučajno obriše sadržaj i klikne van polja, vraća se na staru
// vrijednost umjesto da se sačuva prazno ime.
let popKupacId=null, popPolje=null;

function otvoriPopup(id, field, label, tdEl){
  popKupacId=id; popPolje=field;
  const k=kupci.find(k=>k.id===id);
  document.getElementById('pop-label').textContent=label;
  const inp=document.getElementById('pop-inp');
  inp.value=k?.[field]||'';
  const rect=tdEl.getBoundingClientRect();
  const pop=document.getElementById('inline-pop');
  pop.style.display='block';
  pop.style.top=(window.scrollY+rect.bottom+4)+'px';
  pop.style.left=Math.min(window.scrollX+rect.left, window.innerWidth-260)+'px';
  inp.focus(); inp.select();
}

function popClose(){
  document.getElementById('inline-pop').style.display='none';
  popKupacId=null; popPolje=null;
}

function popSave(){
  const vrijednost=document.getElementById('pop-inp').value.trim();
  if(popPolje==='naziv' && !vrijednost){
    alert('Ime kupca ne može biti prazno.');
    return;
  }
  sacuvajPolje(popKupacId, popPolje, vrijednost);
  popClose();
}

async function sacuvajPolje(id, field, value){
  try{
    const r=await fetch(`${API}/api/config/kupci/${id}`,{
      method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({[field]:value})
    });
    if(!r.ok) throw new Error();
    const k=kupci.find(k=>k.id===id);
    if(k) k[field]=value;
    const sv=document.getElementById('saved-'+id);
    if(sv){sv.textContent='✓';setTimeout(()=>sv.textContent='',2000);}
  }catch(e){alert('Greška pri čuvanju.');load();}
}

function openModal(){
  ['n-naziv','n-tel','n-grad','n-adr','n-email','n-nap'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.value='';
  });
  document.getElementById('modal-msg').innerHTML='';
  document.getElementById('modal').classList.add('on');
  document.getElementById('n-naziv').focus();
}

function closeModal(){
  document.getElementById('modal').classList.remove('on');
}

async function sacuvajNovog(){
  const naziv=(document.getElementById('n-naziv').value||'').trim();
  const msg=document.getElementById('modal-msg');
  if(!naziv){msg.innerHTML='<div class="msg err">Naziv je obavezan.</div>';return;}
  try{
    const r=await fetch(API+'/api/config/kupci',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        naziv,
        telefon:document.getElementById('n-tel').value.trim()||null,
        grad:document.getElementById('n-grad').value.trim()||null,
        adresa:document.getElementById('n-adr').value.trim()||null,
        email:document.getElementById('n-email').value.trim()||null,
        napomena:document.getElementById('n-nap').value.trim()||null,
      })
    });
    if(!r.ok) throw new Error();
    const novi=await r.json();
    kupci.unshift(novi);
    render();
    msg.innerHTML='<div class="msg ok">✓ Kupac sačuvan.</div>';
    setTimeout(closeModal,1200);
  }catch(e){msg.innerHTML='<div class="msg err">Greška pri čuvanju.</div>';}
}

document.getElementById('logout').onclick=async e=>{
  e.preventDefault();
  await fetch(API+'/api/auth/logout',{method:'POST'});
  location.href='login.html';
};

// Zatvori modal klikom van
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal')) closeModal();
});

// Auth provjera
fetch(API+'/api/auth/me').then(r=>{
  if(!r.ok){location.href='login.html';return;}
  return r.json();
}).then(u=>{
  if(!u) return;
  isAdmin=u.rola==='admin';
  if(!isAdmin && !u.moze_ugovarati && !u.moze_prodavati){
    location.href='home.html';return;
  }
  load();
}).catch(()=>location.href='login.html');

document.addEventListener('click', e=>{
  const pop=document.getElementById('inline-pop');
  if(pop.style.display==='block' && !pop.contains(e.target) && !e.target.classList.contains('editabilno')) popClose();
});
document.addEventListener('keydown', e=>{
  if(document.getElementById('inline-pop').style.display!=='block') return;
  if(e.key==='Escape') popClose();
  if(e.key==='Enter') popSave();
});
</script>
