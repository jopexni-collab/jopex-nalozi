<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radni nalozi – JoPeX</title>
<style>
:root{--blue:#1a5fa8;--dark:#134a85;--bg:#f0f2f5;--border:#d0d7de;--red:#c0392b;--green:#1f8a4c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);font-size:11px;}
header{background:var(--blue);color:#fff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:14px;font-weight:700;}
header nav{display:flex;gap:8px;align-items:center;}
header nav a{color:#fff;text-decoration:none;font-size:11px;border:1px solid rgba(255,255,255,.4);padding:3px 8px;border-radius:4px;}
#who{font-size:11px;opacity:.75;}
.toolbar{display:flex;gap:6px;padding:5px 10px;background:#fff;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.toolbar input{font:inherit;font-size:11px;padding:3px 7px;border:1px solid var(--border);border-radius:3px;min-width:180px;}
#stat{font-size:10.5px;color:#6b7a8d;margin-left:auto;}
.btn-sm{font:inherit;font-size:11px;padding:3px 8px;background:var(--blue);color:#fff;border:none;border-radius:3px;cursor:pointer;}

.wrap{overflow:auto;height:calc(100vh - 78px);}
table{border-collapse:collapse;table-layout:fixed;width:max-content;min-width:100%;}

/* RESIZE - svaka th ima resize handle */
thead th{
  background:#1f3864;color:#fff;font-size:11px;font-weight:600;
  position:sticky;top:0;z-index:10;border-right:1px solid #2d4a7a;
  overflow:hidden;
}
.th-inner{display:flex;flex-direction:column;}
.th-label{padding:3px 5px;border-bottom:1px solid #2d4a7a;white-space:normal;word-break:break-word;line-height:1.2;font-size:10.5px;}
.th-filter{padding:1px 2px;background:#162a52;}
.th-filter select,.th-filter input{
  width:100%;font:inherit;font-size:10px;padding:1px 3px;
  background:#1e3566;color:#fff;border:1px solid #3a5590;border-radius:2px;
}
.th-filter select option{background:#1a2a4a;}

/* RESIZE HANDLE */
.resize-handle{
  position:absolute;right:0;top:0;bottom:0;width:4px;
  cursor:col-resize;background:transparent;z-index:1;
}
.resize-handle:hover,.resize-handle.dragging{background:rgba(255,255,255,.4);}
thead th{position:sticky;top:0;}

/* DATA */
tbody tr:hover td{background:#e8f0fe!important;}
tbody tr:nth-child(even) td{background:#f5f7fa;}
td{
  padding:2px 5px;border-bottom:1px solid #d0d7de;border-right:1px solid #e0e4ea;
  white-space:normal;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
  cursor:pointer;word-break:break-word;font-weight:600;
}
td.locked{cursor:default;}
td.editable{background:#fffde7!important;}
td.editable:hover{background:#fff9c4!important;}
td.num{text-align:right;white-space:nowrap;}
td.center{text-align:center;white-space:nowrap;}

/* CHIPS */
.chip{display:inline-block;padding:0px 5px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap;}
.p-hitno{background:#fce8e6;color:#c0392b;}.p-normal{background:#e6f4ea;color:#1f8a4c;}.p-zakazano{background:#fef3e2;color:#e67e22;}
.s-nije{background:#fff9c4;color:#856404;}.s-radu{background:#dce6fc;color:#1a5fa8;}.s-kasni{background:#fce8e6;color:#c0392b;}
.s-zavrseno{background:#e6f4ea;color:#1f8a4c;}.s-ceka{background:#e0f2f1;color:#00796b;}.s-otkazano{background:#f3e5f5;color:#7b1fa2;}.s-zakazano{background:#fef3e2;color:#e67e22;}
.r-da{background:#fce8e6;color:#c0392b;}.r-ne{background:#e6f4ea;color:#1f8a4c;}
.dani-kasni{color:#c0392b;font-weight:700;background:#fce8e6;}
.dani-vatra{color:#c0392b;font-weight:700;background:#fff0e0;}
.dani-blizu{color:#856404;font-weight:700;background:#fff9c4;}
.dani-ok{color:#1f8a4c;font-weight:700;background:#e6f4ea;}
.ceka-blagajnu{color:#c0392b!important;font-weight:700;}
.predano-zeleno{color:#1f8a4c!important;font-weight:700;}

/* INLINE EDITOR POPUP */
#inline-pop{
  display:none;position:fixed;z-index:1000;background:#fff;
  border:1px solid var(--blue);border-radius:6px;padding:8px 10px;
  box-shadow:0 3px 12px rgba(0,0,0,.2);min-width:180px;
}
#inline-pop label{font-size:10.5px;color:#6b7a8d;font-weight:600;display:block;margin-bottom:4px;}
#inline-pop input,#inline-pop select,#inline-pop textarea{
  width:100%;font:inherit;font-size:12px;padding:5px 7px;
  border:1px solid var(--border);border-radius:4px;margin-bottom:6px;
}
#inline-pop textarea{resize:vertical;min-height:60px;}
#inline-pop .pop-btns{display:flex;gap:6px;}
#inline-pop .pop-btns button{flex:1;font:inherit;font-size:11px;padding:4px;border-radius:4px;border:none;cursor:pointer;}
.btn-save{background:var(--blue);color:#fff;}
.btn-cancel{background:#eee;color:#333;}
.empty{padding:30px;text-align:center;color:#6b7a8d;}
a.lk{color:var(--blue);text-decoration:none;}
/* EXCEL NOTE */
.note-cell{position:relative;}
.clamp2-inner{max-height:2.4em;line-height:1.2em;overflow:hidden;display:block;}
.note-cell.has-note::after{content:'';position:absolute;top:0;right:0;
  border-style:solid;border-width:0 7px 7px 0;
  border-color:transparent #c0392b transparent transparent;}
#note-tooltip{display:none;position:fixed;z-index:2000;background:#fffde7;
  border:1px solid #f9a825;border-radius:4px;padding:6px 10px;
  font-size:11.5px;color:#333;max-width:280px;
  box-shadow:2px 2px 6px rgba(0,0,0,.15);white-space:pre-wrap;
  line-height:1.4;pointer-events:none;}
.nova-proc{cursor:pointer;color:#6b7a8d;}
.nova-proc.ima-proc{color:#e67e22;font-weight:600;}
.nova-proc:hover{background:#fef3e2!important;}
#hist-pop{display:none;position:fixed;z-index:1001;background:#fff;
  border:1px solid #e67e22;border-radius:6px;padding:10px 12px;
  box-shadow:0 3px 12px rgba(0,0,0,.2);min-width:260px;}
#hist-pop h4{font-size:12px;color:var(--dark);margin-bottom:8px;}
.hist-close{float:right;cursor:pointer;color:#999;font-size:16px;line-height:1;}
#hist-list{font-size:11px;}
#hist-list div{padding:4px 0;border-bottom:1px solid #f0f0f0;}
#hist-list .hist-datum{font-weight:700;color:#e67e22;}
#hist-list .hist-ko{color:#6b7a8d;}
#hist-list .hist-kad{color:#aaa;font-size:10px;}
.ima-komentar{position:relative;}
.ima-komentar::after{content:'';position:absolute;top:0;right:0;border-width:0 7px 7px 0;border-style:solid;border-color:transparent #c0392b transparent transparent;}
#kom-kontekst-meni{position:fixed;z-index:500;background:#fff;border:1px solid #d0d7de;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:4px;display:none;min-width:170px;}
#kom-kontekst-meni button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;font:inherit;font-size:12.5px;cursor:pointer;border-radius:5px;}
#kom-kontekst-meni button:hover{background:#f0f2f5;}
#kom-kontekst-meni button.obrisi{color:#c0392b;}
#kom-tooltip{position:fixed;z-index:499;background:#fff8e6;border:1px solid #f0d78c;border-radius:6px;padding:8px 10px;font-size:11.5px;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;pointer-events:none;}
</style>
</head>
<body>
<header>
  <h1>📋 Radni nalozi – JoPeX</h1>
  <nav>
    <span id="who"></span>
    <a href="home.html">← Početna</a>
    <a href="index.html">+ Novi</a>
    <a href="#" onclick="undoZadnje(event)" id="btn-undo" style="opacity:.5;cursor:not-allowed" title="Poništi zadnju izmjenu">↩ Undo</a>
    <a href="#" onclick="load()">↺</a>
    <a href="#" id="logout">Izlaz</a>
  </nav>
</header>
<div class="toolbar">
  <input type="text" id="search" placeholder="🔍 Pretraži...">
  <div style="display:flex;gap:4px;border-left:1px solid var(--border);padding-left:8px;margin-left:2px;">
    <button class="btn-sm" id="sf-sakrij" onclick="postaviStornoFilter('sakrij')">Sakrij stornirane</button>
    <button class="btn-sm" id="sf-svi" onclick="postaviStornoFilter('svi')" style="background:#eee;color:#333;">Prikaži sve</button>
    <button class="btn-sm" id="sf-samo" onclick="postaviStornoFilter('samo')" style="background:#eee;color:#333;">Samo stornirani</button>
  </div>
  <span id="stat"></span>
</div>

<div class="wrap">
<table id="tbl">
  <thead id="thead"></thead>
  <tbody id="tbody"><tr><td colspan="20" class="empty">Učitavanje...</td></tr></tbody>
</table>
</div>

<div id="kom-kontekst-meni">
  <button onclick="otvoriKomentarEditor()" id="kom-btn-dodaj">💬 Dodaj komentar</button>
  <button onclick="obrisiKomentar()" class="obrisi" id="kom-btn-obrisi" style="display:none;">🗑 Obriši komentar</button>
</div>
<div id="kom-tooltip"></div>

<div id="kom-editor-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:18px;max-width:380px;width:92vw;">
    <h3 id="kom-editor-naslov" style="margin:0 0 10px;font-size:14px;">Komentar</h3>
    <textarea id="kom-editor-tekst" rows="4" style="width:100%;font:inherit;font-size:13px;padding:8px;border:1px solid var(--border,#ddd);border-radius:6px;resize:vertical;"></textarea>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button onclick="sacuvajKomentar()" style="flex:1;background:var(--blue,#1a5fa8);color:#fff;border:none;border-radius:6px;padding:9px;font:inherit;font-weight:600;cursor:pointer;">Sačuvaj</button>
      <button onclick="document.getElementById('kom-editor-overlay').style.display='none'" style="flex:1;background:#eee;border:none;border-radius:6px;padding:9px;font:inherit;cursor:pointer;">Otkaži</button>
    </div>
  </div>
</div>

<!-- INLINE EDITOR POPUP -->
<div id="inline-pop">
  <label id="pop-label">Vrijednost</label>
  <div id="pop-field"></div>
  <div class="pop-btns">
    <button class="btn-save" onclick="popSave()">✓ Sačuvaj</button>
    <button class="btn-cancel" onclick="popClose()">✗ Otkaži</button>
  </div>
</div>
<div id="note-tooltip"></div>

<script>
const API='';
const STATUSI=['Nije Započeto','Zakazano','U radu','Čeka isporuku','Isporučeno','Kasni','Otkazano'];
const PRIORITETI=['Normal','Hitno','Zakazano'];
const ZADACI=['Kuhinjska ploča','Klupice, Step','Sto','Na Mjeru','Usluge WJ','Usluge Mašina'];
const MATERIJALI=['Granit','Mermer','Tašto','Kvarc','Vještački','Keramika','Kombinovano','Obrada na mašini'];
const REKLAMACIJE=['','NE','DA'];
let all=[], isAdmin=false, trenutniUser=null, stornoFilter='sakrij';
let komentari={}, komentarMeta=null; // komentari: "rBr|kolona" -> {tekst,autor_ime,...}; komentarMeta: trenutno u meniju/editoru {rBr,kolona}
let undoStack=[]; // {rBr, izmjene:[{field, oldVal}, ...]}

// Prima ili (rBr, field, oldVal) za jedno polje, ili (rBr, {polje1:staraVr, polje2:staraVr})
// za grupu polja koje treba vratiti ZAJEDNO jednim klikom (npr. kaskadna izmjena statusa
// i "gotovo" checkbox-a koji se međusobno postavljaju).
function pushUndo(rBr, fieldOrMapa, oldVal){
  const izmjene = typeof fieldOrMapa==='object'
    ? Object.entries(fieldOrMapa).map(([field,ov])=>({field, oldVal:ov}))
    : [{field:fieldOrMapa, oldVal}];
  undoStack.push({rBr, izmjene});
  const btn=document.getElementById('btn-undo');
  if(btn){btn.style.opacity='1';btn.style.cursor='pointer';}
}

async function undoZadnje(e){
  e.preventDefault();
  if(!undoStack.length) return;
  const u=undoStack.pop();
  const body={};
  for(const iz of u.izmjene) body[iz.field]=iz.oldVal;
  try{
    await fetch(`${API}/api/proizvodnja/${u.rBr}`,{
      method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
    });
    const row=all.find(r=>r.r_br==u.rBr);
    if(row) for(const iz of u.izmjene) row[iz.field]=iz.oldVal;
    render();
  }catch(e){alert('Greška pri undo.');}
  if(!undoStack.length){
    const btn=document.getElementById('btn-undo');
    if(btn){btn.style.opacity='.5';btn.style.cursor='not-allowed';}
  }
}

function mozeEditovati(field, row){
  if(!trenutniUser) return false;
  if(isAdmin) return true;
  const finPolja=['ugovorena_suma','avans','avans_opis','za_naplatu','naplata_detalji','naplaceno','naplaceno_opis'];
  if(finPolja.includes(field)){
    // "Ponude" dozvola (moze_ugovarati) vidi/uređuje finansije SVIH naloga. Inače, samo
    // ako je osoba upisana kao "Ugovorio" ZA TAJ nalog (kreirao=ugovorio, isti koncept —
    // ko kreira nalog automatski postaje "Ugovorio" na njemu, vidi proizvodnja.js).
    return !!trenutniUser.moze_ugovarati || !!(row && row.ugovorio_id===trenutniUser.id);
  }
  const statusPolja=['status','gotovo','reklamacija_dodatni_rad','nova_procjena'];
  const jeSvoj=!!(row && row.ugovorio_id===trenutniUser.id);
  if(statusPolja.includes(field)) return trenutniUser.izmjena_statusa||jeSvoj||false;
  return trenutniUser.izmjena_naloga||jeSvoj||false;
}
let popRow=null, popField=null, popTd=null, popEditType=null;

// ─── CHIPS ───────────────────────────────────────────────────────────────
function chipP(p){const m={Hitno:'p-hitno',Normal:'p-normal',Zakazano:'p-zakazano'};return`<span class="chip ${m[p]||'p-normal'}">${esc(p||'Normal')}</span>`;}
function chipS(s, stornirano){
  const m={
    'Nije Započeto':'s-nije','U radu':'s-radu','Kasni':'s-kasni',
    'Isporučeno':'s-zavrseno','Čeka isporuku':'s-ceka',
    'Otkazano':'s-otkazano','Zakazano':'s-zakazano','Završeno':'s-zavrseno'
  };
  const icon=s==='Čeka isporuku'?'🚚 ':s==='Isporučeno'?'✓ ':'';
  const stil=stornirano?' style="text-decoration:line-through;text-decoration-color:#000;text-decoration-thickness:2px;"':'';
  return`<span class="chip ${m[s]||'s-nije'}"${stil}>${icon}${esc(s||'')}</span>`;
}
function chipR(r){return r==='DA'?'<span class="chip r-da">DA</span>':r==='NE'?'<span class="chip r-ne">NE</span>':'';}
function getDani(r){
  if(r.gotovo) return null;
  if(r.planirani_zavrsetak){
    const zav=new Date(r.planirani_zavrsetak.split('T')[0]);
    const danas=new Date();
    danas.setHours(0,0,0,0);
    return Math.round((zav-danas)/(1000*60*60*24));
  }
  return null;
}
function daniClass(d){
  if(d==null) return '';
  if(d<0) return 'dani-kasni';
  if(d<=2) return 'dani-vatra';
  if(d<=5) return 'dani-blizu';
  return 'dani-ok';
}
function daniC(r){
  const d=getDani(r);
  if(d==null) return '<td></td>';
  const cls=daniClass(d);
  const icon=d<0?'🔥 ':'';
  return`<td class="center ${cls}">${icon}${d}</td>`;
}
function zavrsClass(r){
  if(r.gotovo) return '';
  const d=getDani(r);
  return daniClass(d);
}
function fd(d){
  if(!d) return '';
  // Uzmi samo datumski dio da izbjegnemo timezone pomak
  const s=typeof d==='string'?d.split('T')[0]:new Date(d).toISOString().split('T')[0];
  const [y,m,dd]=s.split('-');
  return `${dd}.${m}.${y.slice(2)}`;
}
function fm(n){return(parseFloat(n)||0).toLocaleString('sr-Latn-BA',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jeGotovinaOpis(v){return /^got\b/i.test(String(v||'').trim());}
function lk(u){
  if(!u) return '';
  // Polje može sadržati više linkova odvojenih zarezom (dodano preko kamere, više puta
  // klik = više fotografija) — svaki se prikazuje kao svoja 🔗 ikonica, redom.
  const linkovi=u.split(',').map(s=>s.trim()).filter(Boolean);
  return linkovi.map((link,i)=>`<a class="lk" href="${esc(link)}" target="_blank" title="${linkovi.length>1?`Slika ${i+1}/${linkovi.length}`:''}">🔗</a>`).join(' ');
}
function gv(id){return(document.getElementById(id)||{}).value||'';}

// ─── KOLONE ───────────────────────────────────────────────────────────────
function getCols(){
  const base=[
    {k:'r_br',l:'R.Br.',w:50,filter:'text',render:r=>`<td class="num">${r.stornirano?'⛔ ':''}${r.r_br}${isAdmin?` <button onclick="event.stopPropagation();promijeniBrojNaloga(${r.r_br})" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--blue);" title="Promijeni broj naloga">✎</button>`:''}</td>`,edit:null},
    {k:'zadatak',l:'Zadatak',w:130,filter:'sel',opts:ZADACI,render:r=>`<td>${r.izvor==='terenska_ponuda'?'<span title="Terenska ponuda" style="background:#fff3e0;color:#b8860b;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:5px;">🚐 TEREN</span>':''}${esc(r.zadatak)}</td>`,edit:{type:'select',opts:ZADACI,field:'zadatak'}},
    {k:'materijal',l:'Materijal',w:100,filter:'sel',opts:MATERIJALI,render:r=>`<td>${esc(r.materijal)}</td>`,edit:{type:'select',opts:MATERIJALI,field:'materijal'}},
    {k:'prioritet',l:'Prioritet',w:90,filter:'sel',opts:PRIORITETI,render:r=>`<td>${chipP(r.prioritet)}</td>`,edit:{type:'select',opts:PRIORITETI,field:'prioritet'}},
    {k:'ugovorio',l:'Ugovorio',w:110,filter:'text',render:r=>`<td>${esc(r.ugovorio)}</td>`,edit:{type:'ugovorio',field:'ugovorio_id',label:'Ugovorio'}},
    {k:'narucilac',l:'Naručilac',w:130,filter:'text',render:r=>`<td>${esc(r.narucilac)}</td>`,edit:{type:'text',field:'narucilac',label:'Naručilac'}},
    {k:'status',l:'Status',w:120,filter:'sel',opts:STATUSI,render:r=>`<td>${chipS(r.status,r.stornirano)}</td>`,edit:{type:'select',opts:STATUSI,field:'status'}},
    {k:'pocetak',l:'Ugovoreno',w:90,filter:null,render:r=>`<td>${fd(r.pocetak)}</td>`,edit:{type:'date',field:'pocetak',label:'Ugovoreno (datum)'}},
    {k:'planirani_zavrsetak',l:'Plan. završetak',w:110,filter:'sel',opts:['Kasni','Danas i sutra','Ova sedmica','Ovaj mjesec','Više od mjesec','Bez datuma'],render:r=>`<td class="${zavrsClass(r)}">${fd(r.planirani_zavrsetak)}</td>`,edit:{type:'date',field:'planirani_zavrsetak',label:'Plan. završetak'}},
    {k:'broj_dana',l:'Dana',w:70,filter:'sel',opts:['Kasni','Danas i sutra','Ova sedmica','Ovaj mjesec','Više od mjesec','Bez datuma'],render:r=>daniC(r),edit:null},
    {k:'nova_procjena',l:'Razlog kašnjenja',w:180,filter:'text',render:r=>`<td class="note-cell${r.nova_procjena?' has-note':''}" data-note="${esc(r.nova_procjena)}">${esc(r.nova_procjena)||''}</td>`,edit:{type:'textarea',field:'nova_procjena',label:'Razlog kašnjenja'}},
    {k:'gotovo',l:'Gotovo',w:65,filter:'sel',opts:['Da','Ne'],render:r=>`<td class="center">${r.gotovo?'<span style="color:#1f8a4c;font-size:18px;font-weight:900;line-height:1">✓</span>':''}</td>`,edit:{type:'check',field:'gotovo',label:'Gotovo'}},
    {k:'reklamacija_dodatni_rad',l:'Rek.',w:60,filter:'sel',opts:['DA','NE'],render:r=>`<td class="center">${chipR(r.reklamacija_dodatni_rad)}</td>`,edit:{type:'select',opts:['','NE','DA'],field:'reklamacija_dodatni_rad',label:'Reklamacija'}},
    {k:'napomena',l:'Napomena',w:220,filter:'text',render:r=>`<td class="note-cell${r.napomena?' has-note':''}" data-note="${esc(r.napomena)}"><div class="clamp2-inner">${esc(r.napomena)}</div></td>`,edit:{type:'textarea',field:'napomena',label:'Napomena / upute operateru'}},
    {k:'link_skica',l:'Skica',w:45,filter:null,render:r=>`<td class="center">${lk(r.link_skica)}</td>`,edit:{type:'text',field:'link_skica',label:'Link skica'}},
    {k:'link_ponuda',l:'R.Nalog',w:50,filter:null,render:r=>`<td class="center">${lk(r.link_ponuda)}</td>`,edit:{type:'text',field:'link_ponuda',label:'Link radni nalog'}},
  ];
  // "Velika ponuda" (Generator ponuda alat) — samo admin/Ponude vide finansije, usko.
  // "Mala ponuda" (brza forma) — svako ko radi sa nalozima (unos/status/izmjena) vidi.
  const mozeVidjetiFin=r=>{
    if(isAdmin||!!(trenutniUser&&trenutniUser.moze_ugovarati)) return true;
    if(trenutniUser&&r.ugovorio_id===trenutniUser.id) return true; // kreirao=ugovorio — uvijek vidi svoj nalog
    if(r.izvor==='mala_ponuda') return !!(trenutniUser&&(trenutniUser.unos_naloga||trenutniUser.izmjena_statusa||trenutniUser.izmjena_naloga));
    return false;
  };
  const fin=[
    {k:'ugovorena_suma',l:'Ugovoreno',w:90,filter:null,render:r=>mozeVidjetiFin(r)?`<td class="num">${fm(r.ugovorena_suma)}</td>`:'<td class="num">—</td>',edit:{type:'number',field:'ugovorena_suma',label:'Ugovorena suma (KM)'}},
    {k:'avans',l:'Avans',w:80,filter:null,render:r=>{
      if(!mozeVidjetiFin(r)) return '<td class="num">—</td>';
      const cash=jeGotovinaOpis(r.avans_opis);
      const cls=cash?(r.avans_predano?' predano-zeleno':' ceka-blagajnu'):'';
      return `<td class="num note-cell${r.avans_opis?' has-note':''}${cls}" data-note="${esc(r.avans_opis)}${r.avans_predano?' (predano blagajniku)':''}">${fm(r.avans)}</td>`;
    },edit:{type:'avans',field:'avans',label:'Avans (KM)'}},
    {k:'za_naplatu',l:'Za naplatu',w:90,filter:null,render:r=>{
      if(!mozeVidjetiFin(r)) return '<td class="num">—</td>';
      // Boja prati ISKLJUČIVO da li je blagajnik preuzeo gotovinu (naplata_predano) —
      // true=zeleno, false=crveno (čeka), null=nema gotovinske komponente (samo banka,
      // ili još ništa uplaćeno) — bez posebne boje.
      const cls=r.naplata_predano===true?' predano-zeleno':(r.naplata_predano===false?' ceka-blagajnu':'');
      const naslov=r.naplata_predano===false?'Čeka da blagajnik potvrdi prijem gotovine':'Klik da naplatiš (podjela banka/gotovina)';
      // Kad je plaćeno (naplaceno_iznos>0, za_naplatu palo na 0), prikaži ORIGINALNI iznos
      // koji je bio za naplatu (ugovoreno - avans, prije nego je naplaceno_iznos primijenjen)
      // precrtan linijom — jasno se vidi ŠTA je naplaćeno, ne samo prazna nula.
      const placeno=parseFloat(r.naplaceno_iznos||0)>0.005 && parseFloat(r.za_naplatu||0)<=0.005;
      const iznosPrikaz=placeno
        ? `<span style="text-decoration:line-through;text-decoration-color:#000;text-decoration-thickness:1.5px;">${fm(parseFloat(r.ugovorena_suma||0)-parseFloat(r.avans||0))}</span>`
        : fm(r.za_naplatu);
      return `<td class="num note-cell${cls}" data-note="${esc(r.naplaceno_opis||'')}" title="${naslov}">${iznosPrikaz}</td>`;
    },edit:{type:'naplata-split',field:'avans',label:'Naplata ostatka'}},
    {k:'naplaceno',l:'✓ Napl.',w:55,filter:'sel',opts:['Da','Ne'],render:r=>mozeVidjetiFin(r)?`<td class="center">${r.naplaceno?'<span style="color:#1f8a4c;font-size:16px;font-weight:900">✓</span>':''}</td>`:'<td class="center">—</td>',edit:{type:'check',field:'naplaceno',label:'Naplaćeno'}},
  ];
  const admOnly=isAdmin?[
    {k:'_del',l:'',w:40,filter:null,render:r=>`<td class="center"><button onclick="obrisiNalog(${r.r_br},event)" style="background:none;border:none;cursor:pointer;font-size:14px;color:#c0392b;" title="Obriši nalog">🗑</button></td>`,edit:null},
  ]:[];
  return [...base,...fin,...admOnly];
}

          <option value="">Sve</option>
          <option>Danas</option><option>Ova sedmica</option><option>Ovaj mjesec</option>
          <option>Ova godina</option><option>Prošli mjesec</option><option>Prošla godina</option>
          <option>Custom...</option>
        </select>
        <div id="custom-od-do" style="display:none;margin-top:2px;">
          <input type="date" id="filter-od" oninput="render()" placeholder="Od"
            style="width:100%;font:inherit;font-size:10px;padding:2px 3px;background:#1e3566;color:#fff;border:1px solid #3a5590;border-radius:2px;margin-bottom:2px;">
          <input type="date" id="filter-do" oninput="render()" placeholder="Do"

        </div>
      </div>`;
    } else if(c.filter==='text'){
      flt=`<div class="th-filter"><input type="text" id="f-${c.k}" placeholder="..." oninput="render()"></div>`;
    } else if(c.filter==='sel'){
      flt=`<div class="th-filter"><select id="f-${c.k}" onchange="render()"><option value="">Sve</option>${(c.opts||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`;
    }
    return`<th style="width:${c.w}px" data-key="${c.k}"><div class="th-inner"><div class="th-label">${c.l}</div>${flt}</div><div class="resize-handle"></div></th>`;

// ─── COLUMN RESIZE ────────────────────────────────────────────────────────
function saveColWidths(){
  const ths=document.querySelectorAll('#thead th[data-key]');
  const widths={};
  ths.forEach(th=>widths[th.dataset.key]=th.offsetWidth);
  localStorage.setItem('jopex_col_widths', JSON.stringify(widths));
}

function loadColWidths(){
  try{
    const saved=localStorage.getItem('jopex_col_widths');
    if(!saved) return;
    const widths=JSON.parse(saved);
    document.querySelectorAll('#thead th[data-key]').forEach(th=>{
      if(widths[th.dataset.key]) th.style.width=widths[th.dataset.key]+'px';
    });
  }catch(e){}
}

function initResize(){
  document.querySelectorAll('.resize-handle').forEach(handle=>{
    let startX,startW,th;
    handle.addEventListener('mousedown',e=>{
      th=handle.parentElement;
      startX=e.pageX; startW=th.offsetWidth;
      handle.classList.add('dragging');
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
      e.preventDefault();
    });
    function onMove(e){th.style.width=(Math.max(40,startW+e.pageX-startX))+'px';}
    function onUp(){
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      saveColWidths(); // sačuvaj nakon resize-a
    }
  });
}

// ─── FILTER & RENDER ──────────────────────────────────────────────────────
function postaviStornoFilter(v){
  stornoFilter=v;
  const stilAktivan={background:'var(--blue)',color:'#fff'};
  const stilNeaktivan={background:'#eee',color:'#333'};
  ['sakrij','svi','samo'].forEach(k=>{
    const btn=document.getElementById('sf-'+k);
    Object.assign(btn.style, k===v?stilAktivan:stilNeaktivan);
  });
  render();
}

function filterRows(){
  const q=gv('search').toLowerCase();
  const cols=getCols();
  const fPocetak=gv('f-pocetak');
  return all.filter(r=>{
    if(q&&![r.narucilac,r.napomena,r.materijal,r.ugovorio,r.zadatak].some(f=>f&&String(f).toLowerCase().includes(q))) return false;

    // Storno filter: 'sakrij' (podrazumevano) = ne prikazuj stornirane; 'samo' = prikazi
    // SAMO stornirane; 'svi' = prikazi sve pomiješano.
    if(stornoFilter==='sakrij' && r.stornirano) return false;
    if(stornoFilter==='samo' && !r.stornirano) return false;

    // Filter za Ugovoreno (pocetak) - period
    if(fPocetak){
      if(!r.pocetak) return false;
      const d=new Date(r.pocetak.split('T')[0]);
      const danas=new Date(); danas.setHours(0,0,0,0);
      if(fPocetak==='Danas'){
        if(d.toDateString()!==danas.toDateString()) return false;
      } else if(fPocetak==='Ova sedmica'){
        const pon=new Date(danas); pon.setDate(danas.getDate()-((danas.getDay()+6)%7));
        const ned=new Date(pon); ned.setDate(pon.getDate()+6);
        if(d<pon||d>ned) return false;
      } else if(fPocetak==='Ovaj mjesec'){
        if(d.getMonth()!==danas.getMonth()||d.getFullYear()!==danas.getFullYear()) return false;
      } else if(fPocetak==='Ova godina'){
        if(d.getFullYear()!==danas.getFullYear()) return false;
      } else if(fPocetak==='Prošli mjesec'){
        const pm=new Date(danas.getFullYear(),danas.getMonth()-1,1);
        if(d.getMonth()!==pm.getMonth()||d.getFullYear()!==pm.getFullYear()) return false;
      } else if(fPocetak==='Prošla godina'){
        if(d.getFullYear()!==danas.getFullYear()-1) return false;
      } else if(fPocetak==='Custom...'){
        const od=document.getElementById('filter-od')?document.getElementById('filter-od').value:'';
        const do_=document.getElementById('filter-do')?document.getElementById('filter-do').value:'';
        if(od&&d<new Date(od)) return false;
        if(do_&&d>new Date(do_)) return false;
      }
    }
    for(const c of cols){
      if(!c.filter) continue;
      const fv=gv('f-'+c.k);
      if(!fv) continue;
      // Posebna logika za broj_dana i planirani_zavrsetak
      if(c.k==='broj_dana'||c.k==='planirani_zavrsetak'){
        const d=getDani(r);
        if(fv==='Bez datuma'){if(d!=null) return false;}
        else if(fv==='Kasni'){if(d==null||d>=0) return false;}
        else if(fv==='Danas i sutra'){if(d==null||d<0||d>1) return false;}
        else if(fv==='Ova sedmica'){if(d==null||d<0||d>7) return false;}
        else if(fv==='Ovaj mjesec'){if(d==null||d<0||d>30) return false;}
        else if(fv==='Više od mjesec'){if(d==null||d<=30) return false;}
        continue;
      }
      // Posebna logika za Ugovoreno (pocetak) - filter po periodu
      if(c.k==='pocetak'){
        if(!r.pocetak) return false;
        const d=new Date(r.pocetak.split('T')[0]);
        const danas=new Date(); danas.setHours(0,0,0,0);
        if(fv==='Danas'){
          if(d.toDateString()!==danas.toDateString()) return false;
        } else if(fv==='Ova sedmica'){
          const pon=new Date(danas); pon.setDate(danas.getDate()-danas.getDay()+1);
          const ned=new Date(pon); ned.setDate(pon.getDate()+6);
          if(d<pon||d>ned) return false;
        } else if(fv==='Ovaj mjesec'){
          if(d.getMonth()!==danas.getMonth()||d.getFullYear()!==danas.getFullYear()) return false;
        } else if(fv==='Ova godina'){
          if(d.getFullYear()!==danas.getFullYear()) return false;
        } else if(fv==='Prošli mjesec'){
          const pm=new Date(danas.getFullYear(),danas.getMonth()-1,1);
          if(d.getMonth()!==pm.getMonth()||d.getFullYear()!==pm.getFullYear()) return false;
        } else if(fv==='Prošla godina'){
          if(d.getFullYear()!==danas.getFullYear()-1) return false;
        } else if(fv==='Custom...'){
          const od=document.getElementById('filter-od').value;
          const do_=document.getElementById('filter-do').value;
          if(od&&d<new Date(od)) return false;
          if(do_&&d>new Date(do_)) return false;
        }
        continue;
      }
      const rv=String(r[c.k]||'');
      if(c.filter==='sel'&&rv!==fv) return false;
      if(c.filter==='text'&&!rv.toLowerCase().includes(fv.toLowerCase())) return false;
    }
    return true;
  });
}

function onPocetakFilter(){
  const fv=gv('f-pocetak');
  const odDo=document.getElementById('custom-od-do');
  if(odDo) odDo.style.display=fv==='Custom...'?'block':'none';
  render();
}

function clearCustomDate(){
  const sel=document.getElementById('f-pocetak');
  if(sel) sel.value='';
  const odDo=document.getElementById('custom-od-do');
  if(odDo) odDo.style.display='none';
  render();
}

function addTdClass(html, cls){
  // Ako <td> već ima class="...", spoji klase; inače dodaj novi atribut.
  const m = html.match(/^<td\s+class="([^"]*)"/);
  if(m) return html.replace(/^<td\s+class="([^"]*)"/, `<td class="$1 ${cls}"`);
  return html.replace('<td', `<td class="${cls}"`);
}

function render(){
  const rows=filterRows();
  const cols=getCols();
  document.getElementById('stat').textContent=`${rows.length} / ${all.length} naloga`;
  if(!rows.length){document.getElementById('tbody').innerHTML=`<tr><td colspan="${cols.length}" class="empty">Nema naloga.</td></tr>`;return;}
  document.getElementById('tbody').innerHTML=rows.map(r=>`<tr data-rbr="${r.r_br}"${r.stornirano?' style="text-decoration:line-through;text-decoration-color:#000;text-decoration-thickness:2px;color:#888;"':''}>${cols.map(c=>{
    let cell=c.render(r);
    if(c.edit&&!mozeEditovati(c.edit.field,r)){
      cell=addTdClass(cell,'locked');
    }else if(c.edit&&mozeEditovati(c.edit.field,r)){
      cell=addTdClass(cell,'editable');
    }
    return dodajKomentarAtribut(cell, r.r_br, c.k);
  }).join('')}</tr>`).join('');
}

// Dodaje desni-klik hendler na SVAKU ćeliju (za komentare, kao u Excel-u) i crveni
// trougao u uglu ako komentar već postoji — bez potrebe da se svaka kolona pojedinačno
// mijenja (isti obrazac kao addTdClass iznad).
function dodajKomentarAtribut(html, rBr, kolona){
  const kljuc=rBr+'|'+kolona;
  const imaKom=!!komentari[kljuc];
  let novi=html.replace('<td', `<td oncontextmenu="return otvoriKomentarMeni(event,${rBr},'${kolona}')"`);
  if(imaKom){
    novi=novi.replace('<td', `<td onmouseenter="prikaziKomentarTooltip(event,'${kljuc}')" onmouseleave="document.getElementById('kom-tooltip').style.display='none'"`);
    novi=addTdClass(novi,'ima-komentar');
  }
  return novi;
}

async function ucitajKomentare(){
  try{
    const r=await fetch(`${API}/api/proizvodnja/komentari`);
    const rows=await r.json();
    komentari={};
    rows.forEach(k=>{ komentari[k.r_br+'|'+k.kolona]=k; });
  }catch(e){}
}

function otvoriKomentarMeni(event, rBr, kolona){
  event.preventDefault();
  komentarMeta={rBr, kolona};
  const meni=document.getElementById('kom-kontekst-meni');
  const postoji=!!komentari[rBr+'|'+kolona];
  document.getElementById('kom-btn-dodaj').textContent = postoji ? '💬 Uredi komentar' : '💬 Dodaj komentar';
  document.getElementById('kom-btn-obrisi').style.display = postoji ? 'block' : 'none';
  meni.style.left=event.clientX+'px';
  meni.style.top=event.clientY+'px';
  meni.style.display='block';
  return false;
}
document.addEventListener('click', ()=>{ document.getElementById('kom-kontekst-meni').style.display='none'; });

function otvoriKomentarEditor(){
  document.getElementById('kom-kontekst-meni').style.display='none';
  if(!komentarMeta) return;
  const postojeci=komentari[komentarMeta.rBr+'|'+komentarMeta.kolona];
  document.getElementById('kom-editor-naslov').textContent=`Komentar — nalog #${komentarMeta.rBr}, ${komentarMeta.kolona}`;
  document.getElementById('kom-editor-tekst').value=postojeci?postojeci.tekst:'';
  document.getElementById('kom-editor-overlay').style.display='flex';
  document.getElementById('kom-editor-tekst').focus();
}

async function sacuvajKomentar(){
  if(!komentarMeta) return;
  const tekst=document.getElementById('kom-editor-tekst').value.trim();
  if(!tekst){ alert('Komentar ne može biti prazan.'); return; }
  try{
    const r=await fetch(`${API}/api/proizvodnja/${komentarMeta.rBr}/komentar/${komentarMeta.kolona}`,{
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tekst}),
    });
    if(!r.ok){ const d=await r.json(); alert('✗ '+(d.error||'Greška.')); return; }
    document.getElementById('kom-editor-overlay').style.display='none';
    await ucitajKomentare();
    render();
  }catch(e){ alert('✗ Greška.'); }
}

async function obrisiKomentar(){
  document.getElementById('kom-kontekst-meni').style.display='none';
  if(!komentarMeta) return;
  if(!confirm('Obrisati ovaj komentar?')) return;
  try{
    await fetch(`${API}/api/proizvodnja/${komentarMeta.rBr}/komentar/${komentarMeta.kolona}`,{method:'DELETE'});
    await ucitajKomentare();
    render();
  }catch(e){ alert('✗ Greška.'); }
}

function prikaziKomentarTooltip(event, kljuc){
  const k=komentari[kljuc];
  if(!k) return;
  const tip=document.getElementById('kom-tooltip');
  tip.innerHTML=`<b>${esc(k.autor_ime||'')}</b>: ${esc(k.tekst)}`;
  tip.style.left=(event.clientX+12)+'px';
  tip.style.top=(event.clientY+12)+'px';
  tip.style.display='block';
}

// ─── INLINE EDIT POPUP ────────────────────────────────────────────────────
const pop=document.getElementById('inline-pop');

document.getElementById('tbody').addEventListener('click',function(e){
  const td=e.target.closest('td');
  const tr=e.target.closest('tr[data-rbr]');
  if(!td||!tr) return;
  if(e.target.tagName==='A') return;
  const rBr=tr.dataset.rbr;
  const row=all.find(r=>r.r_br==rBr);
  if(!row) return;
  const thIdx=Array.from(tr.children).indexOf(td);
  const cols=getCols();
  const col=cols[thIdx];
  if(!col||!col.edit) return;
  if(!mozeEditovati(col.edit.field,row)) return; // nema pravo
  openPop(td,row,col.edit);
});

function openPop(td,row,editCfg){
  popRow=row; popField=editCfg.field; popTd=td; popEditType=editCfg.type;
  document.getElementById('pop-label').textContent=editCfg.label||editCfg.field;
  // Avans ima svoje "+ Dodaj ratu" dugme unutar sadržaja — generičko "Sačuvaj" bi bilo
  // zbunjujuće (dva puta za istu akciju), pa ga sakrivamo samo za ovaj tip.
  document.querySelector('#inline-pop .pop-btns .btn-save').style.display=(editCfg.type==='avans'||editCfg.type==='naplata-split')?'none':'';
  const fEl=document.getElementById('pop-field');
  const val=row[editCfg.field];
  if(editCfg.type==='select'){
    fEl.innerHTML=`<select id="pop-inp">${editCfg.opts.map(o=>`<option${o==(val||'')?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  } else if(editCfg.type==='textarea'){
    fEl.innerHTML=`<textarea id="pop-inp">${esc(val||'')}</textarea>`;
  } else if(editCfg.type==='check'){
    fEl.innerHTML=`<select id="pop-inp"><option value="true"${val?' selected':''}>✓ Da</option><option value="false"${!val?' selected':''}>✗ Ne</option></select>`;
  } else if(editCfg.type==='date'){
    const dv=val?val.split('T')[0]:'';
    fEl.innerHTML=`
      <input type="date" id="pop-cal" value="${dv}" style="font:inherit;width:100%;padding:5px 7px;border:1px solid #ccc;border-radius:4px;cursor:pointer;margin-bottom:4px;">
      <input type="text" id="pop-inp" placeholder="ili ukucaj: 22.7 ili 22/7/28" value=""
        style="font:inherit;width:100%;padding:4px 7px;border:1px solid #ddd;border-radius:4px;font-size:11px;color:#555;">
      <div style="font-size:10px;color:#aaa;margin-top:2px;">Bez godine = ${new Date().getFullYear()}, dvocifrena = 20XX</div>`;
    setTimeout(()=>{
      const cal=document.getElementById('pop-cal');
      const txt=document.getElementById('pop-inp');
      // Text → kalendar (live preview)
      txt.addEventListener('input',()=>{
        const parts=txt.value.trim().split(/[.\\/]/).map(p=>p.trim());
        if(parts.length>=2){
          const d=parseInt(parts[0]),m=parseInt(parts[1]);
          let y=parts[2]?parseInt(parts[2]):new Date().getFullYear();
          if(y<100) y=2000+y;
          if(d&&m&&y) cal.value=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        }
      });
      try{cal.showPicker();}catch(e){}
      cal.focus();
    },50);
  } else if(editCfg.type==='ugovorio'){
    ugovorioIzabraniId=null; ugovorioSlobodniTekst=null;
    // Učitaj SVE zaposlene iz config-a (svako kod nas može da ugovori) — JEDNO polje:
    // kucanje sužava izbor (datalist), a ako upisano ime NIJE na listi, prihvata se
    // tačno ono što je upisano (slobodan tekst, bez posebnog drugog polja).
    const cfg=JSON.parse(localStorage.getItem('jopex_config')||'{}');
    const ugovaraci=cfg.ugovaraci||[];
    const trenutnoIme=ugovaraci.find(u=>u.id==val)?.ime_prezime||'';
    fEl.innerHTML=`
      <input type="text" id="ugovorio-search" list="ugovorio-datalist" placeholder="Kucaj ime — sužava izbor, ili upiši novo ime" value="${esc(trenutnoIme)}"
        style="width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid #ccc;border-radius:4px;" oninput="oznaciUgovorioId()">
      <datalist id="ugovorio-datalist">
        ${ugovaraci.map(u=>`<option value="${esc(u.ime_prezime)}" data-id="${u.id}">`).join('')}

function formatKratakDatum(iso){
  if(!iso) return '';
  const parts=iso.split('-');
  if(parts.length!==3) return '';
  return parseInt(parts[2],10)+'/'+parseInt(parts[1],10);
}

// Zajednička logika za popup 'naplata' i 'avans' - kombinuje izabranu
// vrstu (banka/gotovina) ili slobodno uneseno ime, sa slobodno izabranim
// datumom (ne mora biti današnji - važno za naknadni unos propuštenih uplata)
function updateOpisCombo(prefix){
  const vrstaEl=document.getElementById(prefix+'-vrsta');
  const imeEl=document.getElementById(prefix+'-ime');
  const datumEl=document.getElementById(prefix+'-datum-picker');
  const vrsta=vrstaEl?vrstaEl.value:'';
  const ime=imeEl?imeEl.value.trim():'';
  const datum=formatKratakDatum(datumEl?datumEl.value:'');
  const osnov = ime ? ('got '+ime) : vrsta;
  const val = (osnov && datum) ? (osnov+' '+datum) : (osnov||'');
  const targetId = prefix==='naplata' ? 'pop-inp' : 'avans-opis-inp';
  const inp=document.getElementById(targetId);
  if(inp) inp.value=val;
  const prev=document.getElementById(prefix+'-preview');
  if(prev) prev.textContent=val||'—';
}

function azurirajNaplataSplit(zaNaplatu){
  const bankaIznos=parseFloat(document.getElementById('ns-banka-iznos').value)||0;
  const ostatak=Math.max(0, zaNaplatu-bankaIznos);
  document.getElementById('ns-gotovina-iznos-prikaz').textContent=fm(ostatak)+' KM';
  document.getElementById('ns-gotovina-polja').style.display=ostatak>0.005?'block':'none';
}

async function sacuvajNaplataSplit(zaNaplatu){
  const msg=document.getElementById('ns-msg');
  const bankaIznos=parseFloat(document.getElementById('ns-banka-iznos').value)||0;
  const nacinBanka=document.getElementById('ns-banka-nacin').value;
  const gotovinaIznos=Math.max(0, +(zaNaplatu-bankaIznos).toFixed(2));
  let imeGotovina='';
  if(gotovinaIznos>0.005){
    imeGotovina=(document.getElementById('ns-ime').value||'').trim();
    if(!imeGotovina){ msg.style.color='red'; msg.textContent='Unesite ime (blagajnik ili slobodan unos) za gotovinski dio.'; return; }
  }
  if(bankaIznos<=0.005 && gotovinaIznos<=0.005){ msg.style.color='red'; msg.textContent='Unesite iznos.'; return; }
  try{
    const r=await fetch(`${API}/api/proizvodnja/${popRow.r_br}/naplati-ostatak`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({iznos_banka:bankaIznos, nacin_banka:nacinBanka, iznos_gotovina:gotovinaIznos, ime_gotovina:imeGotovina}),
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Greška.');
    popRow.naplaceno_iznos=d.naplaceno_iznos;
    popRow.naplaceno_opis=d.naplaceno_opis;
    popRow.za_naplatu=d.za_naplatu;
    popRow.naplaceno=d.naplaceno;
    msg.style.color='green'; msg.textContent='✓ Naplata zabilježena — dug zatvoren.';
    setTimeout(()=>{ popClose(); }, 900);
  }catch(e){
    msg.style.color='red'; msg.textContent='✗ '+e.message;
  }
}

let ugovorioIzabraniId=null, ugovorioSlobodniTekst=null;

function oznaciUgovorioId(){
  const tekst=document.getElementById('ugovorio-search').value.trim();
  const opcije=document.querySelectorAll('#ugovorio-datalist option');
  let nadjenId=null;
  opcije.forEach(o=>{ if(o.value===tekst) nadjenId=o.dataset.id; });
  const info=document.getElementById('ugovorio-info');
  if(nadjenId){
    // Ime se TAČNO poklapa sa nekim na listi — koristi taj ID.
    ugovorioIzabraniId=nadjenId;
    ugovorioSlobodniTekst=null;
    document.getElementById('pop-inp').value=nadjenId;
    if(info) info.textContent='✓ Prepoznato sa liste.';
  }else if(tekst){
    // Nije na listi, ali nešto je upisano — prihvata se kao slobodan unos imena.
    ugovorioIzabraniId=null;
    ugovorioSlobodniTekst=tekst;
    document.getElementById('pop-inp').value='';
    if(info) info.textContent='ℹ️ Nije na listi — biće upisano kao novo ime.';
  }else{
    ugovorioIzabraniId=null;
    ugovorioSlobodniTekst=null;
    document.getElementById('pop-inp').value='';
    if(info) info.textContent='';
  }
}

async function sacuvajRatuAvansa(){
  const msg=document.getElementById('rata-msg');
  const iznos=parseFloat(document.getElementById('rata-iznos').value);
  const nacin=document.getElementById('rata-nacin').value;
  if(!(iznos>0)){ msg.style.color='red'; msg.textContent='Unesite iznos veći od 0.'; return; }
  if(!nacin){ msg.style.color='red'; msg.textContent='Izaberite način uplate.'; return; }
  let imeGotovina='';
  if(nacin==='gotovina'){
    imeGotovina=(document.getElementById('rata-ime').value||'').trim();
    if(!imeGotovina){ msg.style.color='red'; msg.textContent='Unesite ime (blagajnik ili slobodan unos).'; return; }
  }
  try{
    const r=await fetch(`${API}/api/proizvodnja/${popRow.r_br}/dodaj-ratu-avansa`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({iznos, nacin, ime_gotovina:imeGotovina}),
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Greška.');
    popRow.avans=d.avans;
    popRow.avans_opis=d.avans_opis;
    popRow.za_naplatu=d.za_naplatu;
    popRow.naplaceno=d.naplaceno;
    msg.style.color='green'; msg.textContent='✓ Rata dodana.';
    setTimeout(()=>{ popClose(); }, 700);
  }catch(e){
    msg.style.color='red'; msg.textContent='✗ '+e.message;
  }
}

async function popSave(){
  if(!popRow||!popField) return;
  const inp=document.getElementById('pop-inp');
  let val=inp.value.trim();
  if(popField==='gotovo') val=val==='true';

  // Datum - čita text input ako je popunjen, inače kalendar
  if(popField==='pocetak'||popField==='planirani_zavrsetak'){
    const cal=document.getElementById('pop-cal');
    const txt=document.getElementById('pop-inp');
    const txtVal=txt?txt.value.trim():'';
    if(txtVal){
      // Parsiraj ručni unos
      const parts=txtVal.split(/[.\\/]/).map(p=>p.trim());
      if(parts.length>=2){
        const d=parseInt(parts[0]),m=parseInt(parts[1]);
        let y=parts[2]?parseInt(parts[2]):new Date().getFullYear();
        if(y<100) y=2000+y;
        if(d&&m&&y) val=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      }
    } else {
      val=cal?cal.value:val;
    }
    if(!val) val=null;
  }

  // Ugovorio: ako je izabrano ime sa liste, val=ID (normalan slučaj). Ako je upisano
  // slobodno ime (nije na listi), šalje se TEKST u polje "ugovorio", a "ugovorio_id" se
  // ne postavlja (ostaje kako je bilo / null) — nema ID-a za nepostojećeg zaposlenog.
  if(popEditType==='ugovorio'&&ugovorioSlobodniTekst){
    const staroZaUndo={ugovorio:popRow.ugovorio, ugovorio_id:popRow.ugovorio_id};
    pushUndo(popRow.r_br, staroZaUndo);
    try{
      const r=await fetch(`${API}/api/proizvodnja/${popRow.r_br}`,{
        method:'PATCH',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ugovorio:ugovorioSlobodniTekst, ugovorio_id:null}),
      });
      if(!r.ok) throw new Error();
      popRow.ugovorio=ugovorioSlobodniTekst;
      popRow.ugovorio_id=null;
      render();
      popClose();
    }catch(e){ alert('Greška pri snimanju.'); }
    return;
  }

  const body={[popField]:val};

  // Skupi SVE stare vrijednosti (direktno izmijenjeno polje + sve što se kaskadno mijenja
  // zajedno s njim) u JEDAN undo zapis — jedan klik na Undo vraća sve odjednom.
  const staroZaUndo={[popField]: popRow[popField]};

  // Kad se stiklira Gotovo = true, automatski promijeni prioritet i status
  if(popField==='gotovo'&&(val===true||val==='true')){
    staroZaUndo.prioritet=popRow.prioritet;
    staroZaUndo.status=popRow.status;
    body.prioritet='Normal';
    body.status='Čeka isporuku';
  }
  // Kad se odstiklira Gotovo = false, vrati na U radu
  if(popField==='gotovo'&&(val===false||val==='false')){
    staroZaUndo.status=popRow.status;
    body.status='U radu';
  }
  // Kad je status = Isporučeno, automatski čekira Gotovo
  if(popField==='status'&&val==='Isporučeno'){
    staroZaUndo.gotovo=popRow.gotovo;
    body.gotovo=true;
  }
  // Kad je reklamacija = DA, vrati status na U radu
  if(popField==='reklamacija_dodatni_rad'&&val==='DA'){
    staroZaUndo.status=popRow.status;
    body.status='U radu';
  }
  pushUndo(popRow.r_br, staroZaUndo);

  try{
    const r=await fetch(`${API}/api/proizvodnja/${popRow.r_br}`,{
      method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
    });
    if(!r.ok) throw new Error();
    popRow[popField]=val;
    if(popEditType==='avans'&&'avans_opis' in body){
      popRow.avans_opis=body.avans_opis;
    }
    // Ako se mijenja ugovorio_id, ažuriraj i ugovorio tekst lokalno
    if(popField==='ugovorio_id'){
      const cfg=JSON.parse(localStorage.getItem('jopex_config')||'{}');
      const u=(cfg.ugovaraci||[]).find(u=>u.id==val);
      if(u) popRow.ugovorio=u.ime_prezime;
    }
    if(popField==='gotovo'&&(val===true||val==='true')){
      popRow.prioritet='Normal';
      popRow.status='Čeka isporuku';
    }
    if(popField==='gotovo'&&(val===false||val==='false')){
      popRow.status='U radu';
    }
    if(popField==='status'&&val==='Isporučeno'){
      popRow.gotovo=true;
    }
    if(popField==='reklamacija_dodatni_rad'&&val==='DA'){
      popRow.status='U radu';
    }
    // Preračunaj za_naplatu ako se mijenja avans ili ugovorena_suma
    if(popField==='avans'||popField==='ugovorena_suma'){
      popRow.za_naplatu=(parseFloat(popRow.ugovorena_suma)||0)-(parseFloat(popRow.avans)||0);
    }
    popClose();
    render();
  }catch(e){alert('Greška pri čuvanju.');}
}

function popClose(){
  pop.style.display='none';
  const trebaOsvjezavanje=popEditType==='avans'||popEditType==='naplata-split';
  popRow=null;popField=null;popTd=null;popEditType=null;
  if(trebaOsvjezavanje) load();
}

async function promijeniBrojNaloga(stariBr){
  const noviBr=prompt(`Novi broj za nalog #${stariBr} (trenutno: ${stariBr}):`, stariBr);
  if(noviBr===null) return; // otkazano
  const noviBrNum=parseInt(noviBr);
  if(!noviBrNum||noviBrNum<=0){ alert('Unesite ispravan broj.'); return; }
  if(noviBrNum===stariBr) return;
  if(!confirm(`Promijeniti broj naloga sa ${stariBr} na ${noviBrNum}?\n\nOvo mijenja i sve povezane zapise u blagajni/banci (nalog/broj se svuda usklađuje).`)) return;
  try{
    const r=await fetch(`${API}/api/proizvodnja/${stariBr}/promijeni-broj`,{
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({novi_r_br:noviBrNum}),
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.error);
    alert(`✓ Broj promijenjen: ${stariBr} → ${noviBrNum}`);
    load();
  }catch(e){ alert('✗ '+e.message); }
}

async function obrisiNalog(rBr, e){
  e.stopPropagation();
  if(!confirm(`Stornirati nalog #${rBr}?\n\nNalog se NEĆE obrisati — ostaje vidljiv u listi (precrtan), a sve vezane gotovinske stavke (avans/naplata) se poništavaju.`)) return;
  try{
    const r=await fetch(`${API}/api/proizvodnja/${rBr}`,{method:'DELETE'});
    if(!r.ok) throw new Error();
    const n=all.find(n=>n.r_br==rBr);
    if(n) n.stornirano=true;
    render();
  }catch(err){alert('Greška pri storniranju.');}
}

async function checkAuth(){
  try{
    const r=await fetch(API+'/api/auth/me');
    if(!r.ok){location.href='login.html';return;}
    const u=await r.json();
    isAdmin=u.rola==='admin';
    trenutniUser=u;
    document.getElementById('who').textContent='👤 '+u.ime_prezime;
    buildHeader();
    loadColWidths();
    load();
  }catch{location.href='login.html';}
}

async function load(){
  try{
    const r=await fetch(API+'/api/proizvodnja');
    if(!r.ok){if(r.status===401){location.href='login.html';return;}throw new Error();}
    all=await r.json();
    all.sort((a,b)=>b.r_br-a.r_br);
    await ucitajKomentare();
    render();
  }catch{
    document.getElementById('tbody').innerHTML=`<tr><td colspan="20" class="empty">Greška pri učitavanju.</td></tr>`;
  }
}

document.getElementById('logout').onclick=async e=>{e.preventDefault();await fetch(API+'/api/auth/logout',{method:'POST'});location.href='login.html';};
document.getElementById('search').addEventListener('input',render);
checkAuth();
</script>
</body></html>
