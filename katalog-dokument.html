<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog — JoPeX</title>
<style>
  /* Stil usklađen sa postojećim JoPeX katalogom — ljubičasto zaglavlje, kartice sa
     slikom kao pozadinom i tekstom preko nje. */
  :root{ --ljubicasta:#330066; --ljubicasta-svijetla:#4d1a8a; --border:#e3e6ea;
         --tekst:#1a2733; --sivo:#8b96a5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       background:#f4f5f7;color:var(--tekst);}

  .traka{background:var(--ljubicasta);padding:14px 20px;display:flex;align-items:center;
         justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .logo{color:#fff;font-size:22px;font-weight:800;letter-spacing:.5px;}
  .traka-info{color:#e8d5ef;font-size:12.5px;}

  .omot{max-width:1180px;margin:0 auto;padding:22px 20px 40px;}
  h1{font-size:26px;margin:0 0 4px;font-weight:700;}
  .podnaslov{font-size:13px;color:var(--sivo);margin-bottom:20px;}

  .alatke{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .btn{padding:8px 14px;border:1px solid var(--border);background:#fff;border-radius:8px;
       cursor:pointer;font-size:12.5px;font-weight:600;color:var(--tekst);}
  .btn.aktivan{background:var(--ljubicasta);color:#fff;border-color:var(--ljubicasta);}
  .btn-pdf{background:var(--ljubicasta);color:#fff;border-color:var(--ljubicasta);margin-left:auto;}

  .grupa-naslov{font-size:15px;font-weight:800;margin:24px 0 12px;color:var(--ljubicasta);}

  /* MREŽNI prikaz — slika je pozadina kartice, tekst preko nje (kao u JoPeX katalogu) */
  /* Kartice su oblikovane kao CIGLA iz JoPeX loga — odnos 2:1, zaobljenje 16% visine
     (izmjereno iz originalnog vektora). Svaki artikal = jedna ciglica. */
  .mreza{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;}
  /* container-type omogucava da se font mjeri prema SIRINI KARTICE (cqw), a ne prema
     ekranu. Zato izgled ostaje isti i na ekranu i u PDF-u, iako je kartica na papiru
     manja (~63mm) nego na ekranu (~290px). */
  .mreza .stavka{position:relative;aspect-ratio:2 / 1;border-radius:24px;overflow:hidden;
                 background:#d8dce1;box-shadow:0 3px 10px rgba(51,0,102,.13);break-inside:avoid;
                 container-type:inline-size;}
  .mreza .poz{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .mreza .sjena{position:absolute;inset:0;
                background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.05) 100%);}
  .mreza .znacka{position:absolute;top:9px;left:9px;background:#fff;color:var(--ljubicasta);
                 font-size:8px;font-size:2.76cqw;font-weight:800;padding:2px 8px;border-radius:11px;
                 text-transform:uppercase;letter-spacing:.2px;}
  .mreza .dno{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;}
  .mreza .naziv{font-size:11.5px;font-size:3.97cqw;font-weight:600;line-height:1.25;margin-bottom:3px;
                text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .mreza .cijena{font-size:13px;font-size:4.48cqw;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .mreza .jm{font-size:7.5px;font-size:2.59cqw;font-weight:500;opacity:.9;}

  /* LINIJSKI prikaz — kompaktno, za duge spiskove */
  .lista .stavka{background:#fff;border-radius:10px;margin-bottom:7px;padding:9px 13px;
                 display:flex;align-items:center;gap:13px;
                 box-shadow:0 1px 3px rgba(0,0,0,.06);break-inside:avoid;}
  .lista .slika{width:72px;height:36px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#eef0f3;}
  .lista .nema-slike{width:72px;height:36px;border-radius:6px;background:#eef0f3;flex-shrink:0;
                     display:flex;align-items:center;justify-content:center;color:#c3c9d1;}
  .lista .info{flex:1;min-width:0;}
  .lista .znacka{display:inline-block;background:#f0e6f5;color:var(--ljubicasta);font-size:9.5px;
                 font-weight:800;padding:2px 8px;border-radius:10px;text-transform:uppercase;margin-bottom:3px;}
  .lista .naziv{font-size:13px;font-weight:600;line-height:1.3;}
  .lista .sifra{font-size:11px;color:var(--sivo);}
  .lista .cijena{font-size:16px;font-weight:800;color:var(--ljubicasta);white-space:nowrap;text-align:right;}
  .lista .jm{font-size:10.5px;color:var(--sivo);font-weight:600;}

  .oznaka-nema{display:inline-block;font-size:9.5px;background:rgba(192,57,43,.9);color:#fff;
               padding:1px 7px;border-radius:8px;margin-top:3px;}

  footer{text-align:center;color:var(--sivo);font-size:11.5px;padding:24px 0 0;}
  .ucitavanje,.greska{text-align:center;padding:50px 20px;color:var(--sivo);}
  .greska{color:#c0392b;}

  @media print{
    body{background:#fff;}
    .alatke{display:none !important;}
    .omot{max-width:100%;padding:0;}
    .mreza{grid-template-columns:repeat(3,1fr);}
    .mreza .stavka,.lista .stavka{box-shadow:none;}
    @page{margin:10mm;}
    /* Pregledači po podrazumijevanom izostavljaju pozadine i slike pri štampi — ovim se
       to isključuje, pa slike UVIJEK izlaze u PDF. */
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    .mreza .stavka{ break-inside:avoid; page-break-inside:avoid; }
    .mreza .poz, .lista .slika{
      display:block !important;
      /* Glatko skaliranje pri stampi — bez ovoga neki pregledaci koriste brzi (nazubljeni)
         algoritam, sto se najvise vidi kad je slika tek nesto manja od potrebne. */
      image-rendering:auto;
    }
    /* 3 kolone: kartica ~63mm -> na 300dpi treba ~748px. Postojece slike su 700px (skoro
       tacno), nove su 1200px (sa rezervom). Vise kolona = manja kartica = ostrija slika,
       pa se namjerno NE smanjuje broj kolona. */
  }

/* ── GOTOVI PROIZVODI ────────────────────────────────────────────────────────── */
.gotov-proizvod{border:1px solid var(--border,#ddd);border-radius:10px;padding:13px;margin-bottom:13px;background:#fff;
  break-inside:avoid;page-break-inside:avoid;}
.gotov-zaglavlje{display:flex;gap:14px;align-items:flex-start;margin-bottom:11px;flex-wrap:wrap;}
.gotov-slika{width:170px;height:130px;object-fit:cover;border-radius:8px;flex-shrink:0;}
.gotov-tekst{flex:1;min-width:170px;}
.gotov-naziv{font-size:17px;font-weight:800;line-height:1.25;}
.gotov-opis{font-size:12.5px;color:#6b7a8d;margin-top:4px;line-height:1.5;}
.gotov-upit{font-size:12.5px;color:#b8860b;font-weight:700;margin-top:6px;}
.gotov-tabela{width:100%;border-collapse:collapse;font-size:12.5px;}
.gotov-tabela th{background:#1f3864;color:#fff;padding:5px 8px;text-align:left;font-weight:700;}
.gotov-tabela td{padding:4px 8px;border-bottom:1px solid #eef0f3;}
.gotov-tabela tr:nth-child(even) td{background:#f7f9fb;}
.gotov-tabela .desno{text-align:right;}
.gotov-mjere{font-size:12.5px;color:#6b7a8d;}
@media print{ .gotov-proizvod{border-color:#ccc;} }

.gotov-mreza{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px;}
.gotov-kartica{border:1px solid var(--border,#ddd);border-radius:10px;overflow:hidden;background:#fff;
  break-inside:avoid;page-break-inside:avoid;}
.gotov-k-slika{width:100%;height:150px;object-fit:cover;display:block;}
.gotov-k-tijelo{padding:9px 11px;}
.gotov-k-naziv{font-size:14px;font-weight:800;line-height:1.3;}
.gotov-k-mjere{font-size:11.5px;color:#8b96a5;margin-top:3px;}
.gotov-k-cijena{font-size:16px;font-weight:800;margin-top:6px;}
.gotov-k-upit{font-size:12.5px;color:#b8860b;font-weight:700;margin-top:6px;}
@media print{ .gotov-mreza{grid-template-columns:repeat(3,1fr);} }

/* Sitne ikonice oblika — diskretno, da ne odvlace paznju sa cijene */
/* Oblici stoje ZBIJENO u jednom redu — ranije su se prelamali, pa je kartica rasla.
   Nazivi se skracuju, a pun naziv ostaje u opisu koji se vidi prelaskom misa. */
.gotov-oblici{display:flex;gap:4px;flex-wrap:nowrap;margin-top:7px;overflow:hidden;}
.oblik-stavka{display:inline-flex;flex-direction:column;align-items:center;gap:0;flex:0 0 auto;max-width:42px;}
.oblik-ikona{width:22px;height:22px;fill:none;stroke:#8b96a5;stroke-width:1.7;}
.oblik-mjera{font-size:8.5px;color:#8b96a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.2;}
.gotov-napomena{font-size:12px;color:#6b7a8d;margin-top:5px;}
.gotov-k-mat{font-size:11px;color:#8b96a5;margin-top:2px;}
@media print{ .oblik-ikona{stroke:#666;} }

.gotov-uslov{font-size:11px;color:#8b96a5;margin-top:6px;line-height:1.5;}
.oblik-uvod{font-size:10.5px;color:#8b96a5;align-self:center;margin-right:2px;}

.oblici-legenda{border:1px solid var(--border,#ddd);border-radius:10px;padding:12px 14px;margin-bottom:16px;background:#fafbfc;
  break-inside:avoid;page-break-inside:avoid;}
.legenda-naslov{font-size:12px;font-weight:800;color:#6b7a8d;letter-spacing:.3px;margin-bottom:8px;}
.legenda-red{display:flex;gap:16px;flex-wrap:wrap;}
.legenda-stavka{display:inline-flex;flex-direction:column;align-items:center;gap:2px;}
.legenda-ime{font-size:10px;color:#8b96a5;white-space:nowrap;}
.legenda-nap{font-size:10.5px;color:#8b96a5;margin-top:8px;}

.oblik-opcija .oblik-ikona{stroke:#c3c9d1;stroke-dasharray:2 2;}
.oblik-opcija .oblik-mjera{color:#c3c9d1;}

.gotov-lijevo{flex:0 0 180px;}
.gotov-lijevo .gotov-slika{width:180px;}
.gotov-dim-spisak{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.gotov-dim{font-size:11px;font-weight:700;background:#eef2f8;color:#1f3864;padding:2px 8px;border-radius:5px;}
.gotov-lijevo .gotov-oblici{margin-top:7px;gap:5px;flex-wrap:wrap;}
.gotov-lijevo .oblik-ikona{width:23px;height:23px;}

.gotov-k-cijene{margin-top:7px;}
.gotov-k-red{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 0;border-bottom:1px solid #f2f3f5;}
.gotov-k-mjera{font-size:11.5px;color:#6b7a8d;}
.gotov-k-iznos{font-size:14px;font-weight:800;white-space:nowrap;}
.gotov-k-izvedba{font-size:10px;color:#8b96a5;padding-bottom:3px;}
.gotov-k-nap{font-size:10px;color:#8b96a5;margin-top:5px;line-height:1.4;}
.gotov-kartica .gotov-oblici{margin-top:8px;gap:4px;}
.gotov-kartica .oblik-ikona{width:21px;height:21px;}
.gotov-kartica .oblik-mjera{font-size:8px;}

.th-nap{display:block;font-size:9.5px;font-weight:400;opacity:.75;}

.gotov-k-ikona{display:inline-flex;flex:0 0 auto;}
.gotov-k-ikona .oblik-ikona{width:17px;height:17px;stroke:#8b96a5;}
.th-ikona{display:inline-flex;vertical-align:middle;margin-right:4px;}
.th-ikona .oblik-ikona{width:16px;height:16px;stroke:#fff;stroke-width:1.8;}

.gotov-sastojci{margin-top:6px;}
.gotov-sastojak{font-size:12px;line-height:1.5;}
.s-naziv{color:#8b96a5;text-transform:capitalize;}
.s-artikal{font-weight:700;}
.gotov-ostali{margin-top:8px;padding-top:7px;border-top:1px solid #eef0f3;}
.gotov-ostali-nas{font-size:10px;color:#8b96a5;font-weight:700;letter-spacing:.2px;}
.gotov-ostali-red{font-size:11px;color:#6b7a8d;line-height:1.5;}
.gotov-ostali-nap{font-size:10px;color:#b8860b;margin-top:2px;}

.gotov-k-ostali{font-size:10px;color:#8b96a5;margin-top:7px;padding-top:6px;border-top:1px solid #f2f3f5;line-height:1.5;}
.gotov-k-upit-mali{color:#b8860b;margin-top:1px;}
</style>
</head>
<body>
<div class="traka">
  <img src="logo-bijeli.svg" alt="JoPeX" style="height:36px;display:block;">
  <div class="traka-info" id="traka-info"></div>
</div>
<div class="omot">
  <h1 id="naslov">Katalog</h1>
  <div class="podnaslov" id="podnaslov"></div>

  <div class="alatke">
    <button class="btn" id="btn-mreza" onclick="postaviPrikaz('mreza')">▦ Mrežni prikaz</button>
    <button class="btn" id="btn-lista" onclick="postaviPrikaz('lista')">☰ Linijski prikaz</button>
    <button class="btn" id="btn-nazad" onclick="katalogNazad()" style="display:none;">← Nazad</button>
    <button class="btn btn-pdf" id="btn-pdf" onclick="sacuvajPdf()">⬇ Sačuvaj kao PDF</button>
  </div>

  <div id="sadrzaj"><div class="ucitavanje">Učitavanje kataloga...</div></div>

  <footer>
    <div id="podaci-firme">JoPeX — kamen i obrada</div>
    <div id="info-posiljaoca" style="margin-top:4px;"></div>
  </footer>
</div>

<script>
/* ═══ JEZICI ═══════════════════════════════════════════════════════════════════════
   Katalog za inostranstvo. Nazivi proizvoda dolaze iz baze (naziv_en, naziv_it...),
   a stalni tekst se prevodi ovdje. Ako prevoda nema, pada na osnovni jezik — bolje
   nego prazno polje. */
const PRIJEVODI = {
  bs: { materijal:'Materijal', dostupno_i_u:'Dostupno i u:', na_upit:'cijena na upit',
        cijena_na_upit:'Cijena na upit', izvedba:'Izvedba', postolje_ploca:'postolje + ploča',
        cijena:'Cijena', mjera:'Mjera', dostupne_mjere:'Dostupne mjere:',
        oblici:'Oblici stolova', materijali:'Materijali', gotovi:'Gotovi proizvodi',
        uslov:'Cijena je za navedenu izvedbu i mjeru u zaglavlju kolone. Druga izvedba ili mjera mijenja cijenu.',
        oblici_nap:'Dostupnost oblika zavisi od postolja — uz svaki proizvod stoji šta nosi.',
        prazan:'Katalog je prazan.' },
  en: { materijal:'Material', dostupno_i_u:'Also available in:', na_upit:'price on request',
        cijena_na_upit:'Price on request', izvedba:'Version', postolje_ploca:'base + top',
        cijena:'Price', mjera:'Size', dostupne_mjere:'Available sizes:',
        oblici:'Table shapes', materijali:'Materials', gotovi:'Finished products',
        uslov:'Price applies to the version shown and the size in the column header. Other versions or sizes change the price.',
        oblici_nap:'Shape availability depends on the base — each product shows what it supports.',
        prazan:'The catalogue is empty.' },
  it: { materijal:'Materiale', dostupno_i_u:'Disponibile anche in:', na_upit:'prezzo su richiesta',
        cijena_na_upit:'Prezzo su richiesta', izvedba:'Versione', postolje_ploca:'base + piano',
        cijena:'Prezzo', mjera:'Misura', dostupne_mjere:'Misure disponibili:',
        oblici:'Forme dei tavoli', materijali:'Materiali', gotovi:'Prodotti finiti',
        uslov:'Il prezzo vale per la versione indicata e la misura nell\'intestazione. Altre versioni o misure cambiano il prezzo.',
        oblici_nap:'La disponibilità delle forme dipende dalla base — ogni prodotto indica cosa supporta.',
        prazan:'Il catalogo è vuoto.' },
  de: { materijal:'Material', dostupno_i_u:'Auch erhältlich in:', na_upit:'Preis auf Anfrage',
        cijena_na_upit:'Preis auf Anfrage', izvedba:'Ausführung', postolje_ploca:'Gestell + Platte',
        cijena:'Preis', mjera:'Maß', dostupne_mjere:'Verfügbare Maße:',
        oblici:'Tischformen', materijali:'Materialien', gotovi:'Fertigprodukte',
        uslov:'Der Preis gilt für die angegebene Ausführung und das Maß in der Spaltenüberschrift. Andere Ausführungen oder Maße ändern den Preis.',
        oblici_nap:'Die Formauswahl hängt vom Gestell ab — bei jedem Produkt steht, was möglich ist.',
        prazan:'Der Katalog ist leer.' },
  fr: { materijal:'Matériau', dostupno_i_u:'Aussi disponible en :', na_upit:'prix sur demande',
        cijena_na_upit:'Prix sur demande', izvedba:'Version', postolje_ploca:'piètement + plateau',
        cijena:'Prix', mjera:'Dimension', dostupne_mjere:'Dimensions disponibles :',
        oblici:'Formes de tables', materijali:'Matériaux', gotovi:'Produits finis',
        uslov:'Le prix s\'applique à la version indiquée et à la dimension en tête de colonne. Une autre version ou dimension modifie le prix.',
        oblici_nap:'Les formes disponibles dépendent du piètement — chaque produit indique ce qu\'il permet.',
        prazan:'Le catalogue est vide.' },
};

/* Jezik i valuta se drze u SVOM objektu, ne citaju se iz "podaci" — taj je deklarisan
   nize u fajlu, pa bi svaki poziv prije njega rusio stranicu. */
const IZBOR = { jezik: 'bs', valuta: 'KM' };

function T(kljuc){
  const j = IZBOR.jezik || 'bs';
  return (PRIJEVODI[j] && PRIJEVODI[j][kljuc]) || PRIJEVODI.bs[kljuc] || kljuc;
}

/* Naziv na izabranom jeziku; ako prevoda nema, ostaje osnovni. */
function nazivJezik(o){
  const j = IZBOR.jezik || 'bs';
  if(j === 'bs') return o.naziv;
  return o['naziv_' + j] || o.naziv;
}

/* Preracun u valutu kataloga. Kurs EUR/KM je FIKSAN, pa je pretvaranje tacno. */
const KURS_EUR = 1.95583;
function uValutu(iznos, izVal){
  const cilj = (IZBOR.valuta || 'KM').toUpperCase();
  const iz = (izVal || 'KM').toUpperCase();
  let v = Number(iznos) || 0;
  if(iz === cilj) return { v, val: cilj };
  if(iz === 'KM' && cilj === 'EUR') return { v: v / KURS_EUR, val: 'EUR' };
  if(iz === 'EUR' && cilj === 'KM') return { v: v * KURS_EUR, val: 'KM' };
  return { v, val: iz };
}

const API = location.origin;
let podaci = null, prikaz = 'mreza';

function esc(s){ return s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fm(n){ return (parseFloat(n)||0).toLocaleString('bs-BA',{minimumFractionDigits:2,maximumFractionDigits:2})+' KM'; }

async function ucitaj(){
  const token = new URLSearchParams(location.search).get('token');
  if(!token){ prikaziGresku('Nedostaje token — link nije potpun.'); return; }
  try{
    const r = await fetch(`${API}/api/katalog-javno/${encodeURIComponent(token)}`);
    const d = await r.json();
    if(!r.ok){ prikaziGresku(d.error || 'Katalog nije dostupan.'); return; }
    podaci = d;
    IZBOR.jezik = d.jezik || 'bs';
    IZBOR.valuta = d.valuta || 'KM';
    prikaz = d.prikaz === 'lista' ? 'lista' : 'mreza';

    document.getElementById('naslov').textContent = d.naslov || 'Katalog proizvoda';
    const dijelovi = [];
    if(d.kupac_naziv) dijelovi.push(`Za: <b>${esc(d.kupac_naziv)}</b>`);
    if(d.sa_cijenama && d.tip_naziv) dijelovi.push(`Cijene: ${esc(d.tip_naziv)}${d.sa_pdv?` (sa PDV ${d.pdv_stopa}%)`:' (bez PDV-a)'}`);
    document.getElementById('podnaslov').innerHTML = dijelovi.join(' · ');
    document.getElementById('traka-info').textContent =
      d.sa_cijenama ? `${T('cijena')}: ${(d.valuta||'KM')}` : '';
    if(d.kreirao_ime){
      const datum = new Date(d.kreirano);
      document.getElementById('info-posiljaoca').textContent =
        `Pripremio: ${d.kreirao_ime} · ${String(datum.getDate()).padStart(2,'0')}.${String(datum.getMonth()+1).padStart(2,'0')}.${datum.getFullYear()}.`;
    }
    render();
  }catch(e){
    /* Prava poruka umjesto opste — bez nje se ne zna da li je pukla mreza, server
       ili sam prikaz, pa "Učitavanje..." ostaje zauvijek. */
    console.error('katalog:', e);
    prikaziGresku('Greška pri učitavanju: ' + (e && e.message ? e.message : e));
  }
}

function prikaziGresku(poruka){
  document.getElementById('sadrzaj').innerHTML = `<div class="greska">✗ ${esc(poruka)}</div>`;
  document.querySelector('.alatke').style.display = 'none';
}

/* Slike se učitavaju LIJENO (samo vidljive) — što je dobro za brzinu, ali znači da
   neučitane slike NE IZLAZE u PDF. Zato se prije štampe sve prisilno učitaju i čeka se
   da stignu. Ovo je bio uzrok da PDF izađe bez slika. */
async function sacuvajPdf(){
  const btn = document.getElementById('btn-pdf');
  const slike = [...document.querySelectorAll('#sadrzaj img')];

  /* Na EKRANU se prikazuju thumbnaili (20x manje podataka). Za PDF trebaju PUNE slike —
     inace se thumbnail od 150px razvlaci na ~60mm i izlazi nazubljen.

     Zasto ovako, a ne prostom zamjenom src-a: slike imaju loading="lazy", pa one van
     ekrana NE POCNU da se ucitavaju samo zato sto im se promijeni src. Naknadno
     postavljanje loading="eager" je nepouzdano. Zato se pune slike prvo skinu preko
     new Image() (sto lijeno ucitavanje potpuno zaobilazi), pa se tek onda zamijeni src —
     tada je slika vec u kesu i zamjena je trenutna. */
  const zaZamjenu = slike
    .map(img => ({ img, puna: img.dataset.puna }))
    .filter(x => x.puna && x.img.src !== x.puna);

  if(zaZamjenu.length){
    btn.disabled = true;
    let gotovo = 0;
    const osvjezi = () => { btn.textContent = `Priprema slika (${gotovo}/${zaZamjenu.length})...`; };
    osvjezi();

    await Promise.all(zaZamjenu.map(({puna}) => new Promise(res => {
      const pre = new Image();
      const zavrsi = () => { gotovo++; osvjezi(); res(); };
      pre.onload = zavrsi;
      pre.onerror = zavrsi;      // neuspjele se ne cekaju vjecno
      pre.src = puna;
    })));

    // Slike su u kesu — zamjena je sada trenutna, bez cekanja na mrezu.
    zaZamjenu.forEach(({img, puna}) => { img.loading = 'eager'; img.src = puna; });

    btn.disabled = false;
    btn.textContent = '⬇ Sačuvaj kao PDF';
  }

  /* Pauza da pregledac stigne da iscrta zamijenjene slike prije nego otvori dijalog za
     stampu. Ranije je bilo 120ms — premalo kad ima puno slika, pa je stampa hvatala
     stari (thumbnail) prikaz. */
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  setTimeout(() => window.print(), 400);
}

function postaviPrikaz(p){ prikaz = p; render(); }

function render(){
  if(!podaci) return;
  document.getElementById('btn-mreza').classList.toggle('aktivan', prikaz==='mreza');
  document.getElementById('btn-lista').classList.toggle('aktivan', prikaz==='lista');

  const gotovi = podaci.gotovi || [];
  if(!podaci.stavke.length && !gotovi.length){
    document.getElementById('sadrzaj').innerHTML = '<div class="ucitavanje">Katalog je prazan.</div>';
    return;
  }

  /* GOTOVI PROIZVODI idu PRVI — to je ono sto kupac kupuje. Materijali su ono od cega
     se pravi, pa dolaze ispod, kao dopuna. */
  let html = '';
  if(gotovi.length){
    /* LEGENDA na pocetku — svi oblici koji se u ovom katalogu pojavljuju, jednom.
       Uz proizvode onda stoje samo sitne oznake, pa strana ostaje citljiva. */
    const sviOblici = [...new Set(gotovi.flatMap(p => (p.dimenzije||[]).map(d => d.oblik)).filter(Boolean))];
    if(sviOblici.length > 1){
      html += `<div class="oblici-legenda">
        <div class="legenda-naslov">${T('oblici')}</div>
        <div class="legenda-red">
          ${sviOblici.map(o=>`
            <span class="legenda-stavka">
              ${oblikIkona(o)}
              <span class="legenda-ime">${esc(oblikNaziv(o))}</span>
            </span>`).join('')}
        </div>
        <div class="legenda-nap">${T('oblici_nap')}</div>
      </div>`;
    }

    const poGrupi = {};
    gotovi.forEach(p => { (poGrupi[p.grupa_naziv||T('gotovi')] ||= []).push(p); });
    /* Gotovi proizvodi postuju izabrani prikaz — u mrezi idu kao kartice jedna uz
       drugu, u listi jedan ispod drugog sa punom tabelom cijena. */
    html += Object.entries(poGrupi).map(([grupa, lista]) => `
      <div class="grupa-naslov">${esc(grupa)}</div>
      ${prikaz==='mreza'
        ? `<div class="gotov-mreza">${lista.map(gotovKartica).join('')}</div>`
        : lista.map(gotovProizvod).join('')}
    `).join('');
  }

  if(podaci.stavke.length){
    const poGrupama = {};
    podaci.stavke.forEach(s => { (poGrupama[s.grupa||'Ostalo'] ||= []).push(s); });
    if(gotovi.length) html += `<div class="grupa-naslov" style="margin-top:26px;">${T('materijali')}</div>`;
    html += Object.entries(poGrupama).map(([grupa, stavke]) => `
      <div class="grupa-naslov">${esc(grupa)}</div>
      <div class="${prikaz}">${stavke.map(s => prikaz==='mreza' ? kartica(s) : red(s)).join('')}</div>
    `).join('');
  }

  document.getElementById('sadrzaj').innerHTML = html;
}

/* Gotov proizvod: slika, naziv i TABELA svih kombinacija sa cijenama.
   Kad katalog ide bez cijena, tabela prikazuje samo mjere. */

/* Kartica za MREZNI prikaz — slika, naziv i raspon cijena. Puna tabela kombinacija
   ne staje u karticu, pa se prikazuje "od–do"; detalji su u listi. */

/* Mjera iz cjenovnika je TEKST snimljen u trenutku snimanja; opisDim() ga danas moze
   ispisati drugacije (npr. sa "· H750"). Zato se poredi po BROJEVIMA — tako se
   ikonica nadje i kad se zapis u medjuvremenu promijenio. */
function nadjiDimenziju(p, tekst){
  const dims = p.dimenzije || [];
  if(!dims.length || !tekst) return null;

  // Prvo tacno poklapanje
  const tacno = dims.find(d => opisDim(d) === tekst);
  if(tacno) return tacno;

  // Pa po brojevima: "1600×900 · H750" i "1600×900" imaju iste prve dvije mjere
  const broj = s => (String(s).match(/\d+/g) || []).map(Number);
  const t = broj(tekst);
  if(!t.length) return null;
  return dims.find(d => {
    const b = broj(opisDim(d));
    return b.length && t.length && b[0] === t[0] && (b[1] ?? null) === (t[1] ?? null);
  }) || null;
}

function gotovKartica(p){
  /* Kartica pokazuje CIJENU PO DIMENZIJI, ne samo raspon — kupac odmah vidi sta kosta
     koja mjera. Ispod idu oblici koji su za to postolje mogući. */
  const cijene = p.cijene || [];
  const val = cijene[0]?.valuta || 'KM';

  // Grupisanje po mjeri; ako ima vise izvedbi, uzima se najniza (od te cijene)
  const poMjeri = {};
  for(const x of cijene){
    const k = x.dimenzija || '—';
    const v = Number(x.cijena) || 0;
    if(!poMjeri[k] || v < poMjeri[k].cijena) poMjeri[k] = { cijena: v, izvedba: x.opis_izbora };
  }
  const mjere = Object.keys(poMjeri);
  const viseIzvedbi = new Set(cijene.map(x=>x.opis_izbora)).size > 1;

  /* Oblici dolaze sa PROIZVODA — vaze za sve njegove mjere. Uz njih idu i oblici
     samih mjera, ako se razlikuju. */
  const sviOblici = [...new Set([
    ...(p.dimenzije||[]).map(d => d.oblik),
    ...(p.moguci_oblici||[]),
  ].filter(Boolean))];

  return `
    <div class="gotov-kartica">
      ${p.slika_url
        ? `<img class="gotov-k-slika" src="${esc(p.slika_url)}" loading="lazy" alt="${esc(p.naziv)}">`
        : '<div class="nema-slike gotov-k-slika">🍽️</div>'}
      <div class="gotov-k-tijelo">
        <div class="gotov-k-naziv">${esc(nazivJezik(p))}</div>
        ${(p.sastojci||[]).length
          ? `<div class="gotov-k-mat">${p.sastojci.map(s=>esc(s.artikli.join(' · '))).join(' + ')}</div>`
          : ((p.materijali||[]).length ? `<div class="gotov-k-mat">${(p.materijali||[]).map(esc).join(', ')}</div>` : '')}

        ${podaci.sa_cijenama ? (
          p.na_upit || !mjere.length
            ? `<div class="gotov-k-upit">${T('cijena_na_upit')}</div>`
            : `<div class="gotov-k-cijene">
                ${/* Ikonica oblika ISPRED mjere — okrugli sto se odmah razlikuje od
                      pravougaonog, bez citanja brojeva. */''}
                ${/* Bez ikonice ispred mjere — oblici stoje ISPOD cijena, jednom za
                      cijeli proizvod. Mjera je uvijek duzina × sirina. */''}
                ${mjere.map(m=>{
                  return `
                  <div class="gotov-k-red">
                    <span class="gotov-k-mjera">${esc(m)}</span>
                    <span class="gotov-k-iznos">${fmv(poMjeri[m].cijena, val)}</span>
                  </div>
                  ${viseIzvedbi && poMjeri[m].izvedba
                    ? `<div class="gotov-k-izvedba">${esc(poMjeri[m].izvedba)}</div>` : ''}`;
                }).join('')}
               </div>
               ${viseIzvedbi ? '<div class="gotov-k-nap">Cijena za navedenu izvedbu i mjeru.</div>' : ''}`
        ) : (mjere.length ? `<div class="gotov-k-mjere">${mjere.map(esc).join(' · ')}</div>` : '')}

        ${sviOblici.length ? `<div class="gotov-oblici">
          ${sviOblici.map(o=>`
            <span class="oblik-stavka" title="${esc(oblikNaziv(o))}">
              ${oblikIkona(o)}<span class="oblik-mjera">${esc(oblikKratko(o))}</span>
            </span>`).join('')}
        </div>` : ''}

        ${/* I u kartici stoji sta se jos moze — ranije samo u linijskom prikazu. */''}
        ${(p.sastojci||[]).some(s => (s.ostale_grupe||[]).length) ? `
          <div class="gotov-k-ostali">
            <b>${T('dostupno_i_u')}</b>
            ${p.sastojci.filter(s=>(s.ostale_grupe||[]).length)
              .map(s=>`${esc(s.naziv)}: ${s.ostale_grupe.map(esc).join(' · ')}`).join('<br>')}
            <div class="gotov-k-upit-mali">${T('na_upit')}</div>
          </div>` : ''}
      </div>
    </div>`;
}

/* Cijena sa valutom — fm() uvijek dodaje "KM", pa za EUR treba zasebno. */
function fmv(v, valuta){
  const p = uValutu(v, valuta);
  return p.v.toLocaleString('bs-BA',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + p.val;
}


/* Sitne 2D ikonice oblika — kupcu odmah kazu kako sto izgleda, a ne zauzimaju mjesto.
   Crtaju se kao SVG: uvijek ostre, i pri stampi i na ekranu. */
/* Kratak naziv za ispod ikonice — pun ide u opis koji se vidi prelaskom misa. */

function oblikKratko(o){
  return { PRAV:'pravoug.', KVAD:'kvadrat', KRUG:'okrugli', OVAL:'ovalni',
           BACVA:'bačva', ZAOB:'zaobljen', I:'pravougli', L:'L', U:'U', V:'V',
           N:'nepravil.', G:'G' }[o] || o;
}

function oblikNaziv(o){
  return { PRAV:'Pravougaoni', KVAD:'Kvadratni', KRUG:'Okrugli', OVAL:'Ovalni',
           BACVA:'Bačvasti', ZAOB:'Zaobljeni uglovi', I:'Pravougli', L:'L oblik',
           U:'U oblik', V:'V oblik', N:'Nepravilan', G:'G oblik' }[o] || 'Pravougaoni';
}

function oblikIkona(oblik, naslov){
  const put = {
    PRAV:  '<rect x="2" y="7" width="24" height="14" rx="1"/>',
    KVAD:  '<rect x="6" y="4" width="16" height="16" rx="1"/>',
    KRUG:  '<circle cx="14" cy="14" r="9"/>',
    OVAL:  '<ellipse cx="14" cy="14" rx="12" ry="7"/>',
    BACVA: '<path d="M9 7 h10 a7 7 0 0 1 0 14 h-10 a7 7 0 0 1 0-14 z"/>',
    ZAOB:  '<rect x="2" y="7" width="24" height="14" rx="4"/>',
    I:     '<rect x="2" y="9" width="24" height="10" rx="1"/>',
    L:     '<path d="M3 5 h9 v10 h13 v8 h-22 z"/>',
    U:     '<path d="M3 5 h6 v13 h10 v-13 h6 v19 h-22 z"/>',
    V:     '<path d="M3 5 h8 v6 h6 v-6 h8 v18 h-22 z"/>',
    N:     '<path d="M3 21 h22 l-4 -13 h-14 z"/>',
    G:     '<path d="M3 5 h22 v18 h-9 v-6 h-4 v6 h-9 z"/>',
  }[oblik] || '<rect x="2" y="7" width="24" height="14" rx="1"/>';
  return `<svg class="oblik-ikona" viewBox="0 0 28 28" title="${esc(naslov||'')}">${put}</svg>`;
}

/* Opis dimenzije iz zapisa — novi oblik (mjere{A,B}) ili stari (sirina/visina). */
function opisDim(d){
  const m = d.mjere || {};
  const v = k => Math.round(Number(m[k] ?? 0));
  if(d.oblik === 'KRUG')  return 'Ø' + (v('D') || Math.round(d.precnik||0));
  if(d.oblik === 'KVAD')  return v('A') + '×' + v('A');
  if(m.A && m.B)          return v('A') + '×' + v('B');
  if(d.sirina && d.visina) return Math.round(d.sirina) + '×' + Math.round(d.visina);
  return d.naziv || '';
}

function gotovProizvod(p){
  const cijene = p.cijene || [];
  const saCijenama = podaci.sa_cijenama && cijene.length;

  // Kombinacije se slazu u tabelu: redovi = izbor, kolone = mjere
  const mjere = [...new Set(cijene.map(x => x.dimenzija).filter(Boolean))];
  const izbori = [...new Set(cijene.map(x => x.opis_izbora).filter(Boolean))];
  const nadji = (iz, mj) => cijene.find(x => x.opis_izbora === iz && x.dimenzija === mj);

  return `
    <div class="gotov-proizvod">
      <div class="gotov-zaglavlje">
        <div class="gotov-lijevo">
          ${p.slika_url
            ? `<img class="gotov-slika" src="${esc(p.slika_url)}" loading="lazy" alt="${esc(p.naziv)}">`
            : '<div class="nema-slike gotov-slika">🍽️</div>'}

          ${/* Dimenzije ISPOD SLIKE, pa svi moguci oblici ispod njih — kupac prvo vidi
                kako sto izgleda, pa koje mjere i izvedbe postoje. */''}
          ${(p.dimenzije||[]).length ? `
            <div class="gotov-dim-spisak">
              ${p.dimenzije.map(d=>`<span class="gotov-dim">${esc(opisDim(d))}</span>`).join('')}
            </div>
            <div class="gotov-oblici">
              ${[...new Set([...(p.dimenzije||[]).map(d=>d.oblik), ...(p.moguci_oblici||[])].filter(Boolean))]
                .map(o=>`
                  <span class="oblik-stavka" title="${esc(oblikNaziv(o))}">
                    ${oblikIkona(o)}
                    <span class="oblik-mjera">${esc(oblikKratko(o))}</span>
                  </span>`).join('')}
            </div>` : ''}

          ${/* Grupe koje su dozvoljene a nisu upotrijebljene — sto se moze napraviti i
                od njih, ali po drugoj cijeni. */''}
          ${(p.sastojci||[]).some(s => (s.ostale_grupe||[]).length) ? `
            <div class="gotov-ostali">
              <div class="gotov-ostali-nas">Dostupno i u:</div>
              ${p.sastojci.filter(s=>(s.ostale_grupe||[]).length).map(s=>`
                <div class="gotov-ostali-red">
                  <span class="s-naziv">${esc(s.naziv)}:</span>
                  ${s.ostale_grupe.map(esc).join(' · ')}
                </div>`).join('')}
              <div class="gotov-ostali-nap">cijena na upit</div>
            </div>` : ''}
        </div>
        <div class="gotov-tekst">
          <div class="gotov-naziv">${esc(nazivJezik(p))}</div>
          ${p.opis ? `<div class="gotov-opis">${esc(p.opis)}</div>` : ''}

          ${/* Model postolja i konkretan materijal — kupcu to znaci, za razliku od
                internih naziva grupa. Cijena vazi bas za njih. */''}
          ${(p.sastojci||[]).length ? `<div class="gotov-sastojci">
            ${p.sastojci.map(s=>`
              <div class="gotov-sastojak">
                <span class="s-naziv">${esc(s.naziv)}:</span>
                <span class="s-artikal">${s.artikli.map(esc).join(' · ')}</span>
              </div>`).join('')}
          </div>` : ((p.materijali||[]).length ? `<div class="gotov-napomena">
            Materijal: <b>${(p.materijali||[]).map(esc).join(', ')}</b>
          </div>` : '')}

          ${p.na_upit ? `<div class="gotov-upit">${T('cijena_na_upit')}</div>` : ''}
        </div>
      </div>

      ${saCijenama && izbori.length ? `
        <table class="gotov-tabela">
          <thead><tr>
            <th>Izvedba</th>
            ${/* Ikonica oblika u zaglavlju kolone — okrugli i pravougaoni se razlikuju
                  na prvi pogled, a brojevi ostaju citljivi. */''}
            ${mjere.map(m => `<th class="desno">${esc(m)}</th>`).join('')}
          </tr></thead>
          <tbody>${izbori.map(iz => `
            <tr>
              <td>${esc(iz)}</td>
              ${mjere.map(m => {
                const x = nadji(iz, m);
                /* fm() vec dodaje "KM"; za EUR objekte se valuta ispisuje zasebno. */
                if(!x) return '<td class="desno">—</td>';
                const v = (x.valuta||'KM').toUpperCase();
                const tekst = v === 'KM'
                  ? fm(x.cijena)
                  : (parseFloat(x.cijena)||0).toLocaleString('bs-BA',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + esc(v);
                return `<td class="desno">${tekst}</td>`;
              }).join('')}
            </tr>`).join('')}</tbody>
        </table>
        <div class="gotov-uslov">
${T('uslov')}
        </div>`
      : (mjere.length ? `<div class="gotov-mjere">${T('dostupne_mjere')} ${mjere.map(esc).join(' · ')}</div>` : '')}

      ${/* Kad proizvod nema unesenih dimenzija, ikonice se nemaju odakle crtati.
            Umjesto tihe praznine kaze se sta fali — inace izgleda kao da ne radi. */''}
      ${(!(p.dimenzije||[]).length && podaci.sa_cijenama) ? `<div class="gotov-uslov">
        Cijena važi za navedeni <b>materijal</b> i izvedbu.
      </div>` : ''}

    </div>`;
}

function slikaHtml(s, klasa){
  return s.slika
    ? `<img class="${klasa}" src="${esc(s.slika||s.slika_puna)}" data-puna="${esc(s.slika_puna||'')}" loading="lazy" alt="${esc(s.naziv)}">`
    : `<div class="nema-slike">🪨</div>`;
}

function kartica(s){
  return `<div class="stavka">
    ${s.slika?`<img class="poz" src="${esc(s.slika||s.slika_puna)}" data-puna="${esc(s.slika_puna||'')}" loading="lazy" alt="${esc(s.naziv)}">`:''}
    <div class="sjena"></div>
    <div class="znacka">${esc(s.grupa||'—')}</div>
    <div class="dno">
      <div class="naziv">${esc(s.naziv)}</div>
      ${s.cijena!=null?`<div class="cijena">${fm(s.cijena)} <span class="jm">/ ${esc(s.jed_mjera)}</span></div>`:''}
      ${!s.dostupno?'<div class="oznaka-nema">Trenutno nedostupno</div>':''}
    </div>
  </div>`;
}

function red(s){
  return `<div class="stavka">
    ${slikaHtml(s,'slika')}
    <div class="info">
      <div class="znacka">${esc(s.grupa||'—')}</div>
      <div class="naziv">${esc(s.naziv)}</div>
      <div class="sifra">Šifra: ${esc(s.sifra)}${s.debljina_cm?` · ${s.debljina_cm} cm`:''}${!s.dostupno?' · <span style="color:#c0392b;">nedostupno</span>':''}</div>
    </div>
    ${s.cijena!=null?`<div class="cijena">${fm(s.cijena)}<div class="jm">/ ${esc(s.jed_mjera)}</div></div>`:''}
  </div>`;
}

/* "Nazad" — katalog se iz aplikacije otvara u NOVOM TABU, a tamo history.back() nema
   kuda (to je bio uzrok da dugme ne radi). Zato:
     - ako je tab otvoren iz naše stranice (window.opener) → ZATVORI tab
     - inače, ako postoji prethodna stranica → vrati se
   Ako kupac otvori link direktno, dugme se ne prikazuje — nema gdje da ide. */
function katalogNazad(){
  if(window.opener && !window.opener.closed){ window.close(); return; }
  if(history.length > 1){ history.back(); return; }
  window.close();  // zadnja opcija
}

if((window.opener && !window.opener.closed) || history.length > 1 || document.referrer){
  document.getElementById('btn-nazad').style.display = '';
}

ucitaj();
</script>
